  # Reusable operation fragments referenced via $ref from the paths above and
  # inlined by OpenApiController; sibling keys (tags, summary) override the
  # fragment's.
  x-ops:
    contactIndex:
      summary: List contacts
      description: "Sortable: display_name, created_at, id (default display_name asc). search matches display_name, company_name and email. No status or date filters."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/ContactCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    contactStore:
      summary: Create a contact
      requestBody: { $ref: '#/components/requestBodies/Contact' }
      responses:
        '201': { $ref: '#/components/responses/Contact' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    contactShow:
      summary: Get a contact
      responses:
        '200': { $ref: '#/components/responses/Contact' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    contactUpdate:
      summary: Update a contact
      requestBody: { $ref: '#/components/requestBodies/Contact' }
      responses:
        '200': { $ref: '#/components/responses/Contact' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '423': { $ref: '#/components/responses/Locked' }
        '500': { $ref: '#/components/responses/InternalError' }
    resourceDelete:
      summary: Delete the resource
      responses:
        '204': { description: "Deleted." }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '423': { $ref: '#/components/responses/Locked' }
        '500': { $ref: '#/components/responses/InternalError' }
