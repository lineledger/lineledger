    patch: { tags: [Settings], summary: Update a payment method, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '200': {$ref: '#/components/responses/Document'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Settings] }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <api-key>"
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key

  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1 }, description: Page number. }
    perPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 }, description: Items per page (capped at 100). }
    from: { name: from, in: query, schema: { type: string, format: date }, description: Filter by document date ≥ this date. }
    to: { name: to, in: query, schema: { type: string, format: date }, description: Filter by document date ≤ this date. }
    status: { name: status, in: query, schema: { type: string }, description: "Filter by status (e.g. draft, posted, partial, paid, void)." }
    search: { name: search, in: query, schema: { type: string }, description: Free-text search over the resource's text columns. }
    sort: { name: sort, in: query, schema: { type: string }, description: "Sort column (whitelisted per resource); pair with direction=asc|desc." }
    contact: { name: contact, in: path, required: true, schema: { type: integer } }
    invoice: { name: invoice, in: path, required: true, schema: { type: integer } }
    salesOrder: { name: salesOrder, in: path, required: true, schema: { type: integer } }
    receipt: { name: receipt, in: path, required: true, schema: { type: integer } }
    creditMemo: { name: creditMemo, in: path, required: true, schema: { type: integer } }
    bill: { name: bill, in: path, required: true, schema: { type: integer } }
    billPayment: { name: billPayment, in: path, required: true, schema: { type: integer } }
    cheque: { name: cheque, in: path, required: true, schema: { type: integer } }
    deposit: { name: deposit, in: path, required: true, schema: { type: integer } }
    bankReconciliation: { name: bankReconciliation, in: path, required: true, schema: { type: integer } }
    account: { name: account, in: path, required: true, schema: { type: integer } }
    journalEntry: { name: journalEntry, in: path, required: true, schema: { type: integer } }
    item: { name: item, in: path, required: true, schema: { type: integer } }
    stockAdjustment: { name: stockAdjustment, in: path, required: true, schema: { type: integer } }
    taxCode: { name: taxCode, in: path, required: true, schema: { type: integer } }
    taxAgency: { name: taxAgency, in: path, required: true, schema: { type: integer } }
    taxReturn: { name: taxReturn, in: path, required: true, schema: { type: integer } }
    taxReturnPayment: { name: taxReturnPayment, in: path, required: true, schema: { type: integer } }
    asset: { name: asset, in: path, required: true, schema: { type: integer } }
    assetCategory: { name: assetCategory, in: path, required: true, schema: { type: integer } }
    paymentTerm: { name: paymentTerm, in: path, required: true, schema: { type: integer } }
    paymentMethod: { name: paymentMethod, in: path, required: true, schema: { type: integer } }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
      required: [message]
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
      required: [message]
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    Address:
      type: object
      properties:
        line1: { type: [string, "null"] }
        line2: { type: [string, "null"] }
        city: { type: [string, "null"] }
        region: { type: [string, "null"] }
        postal_code: { type: [string, "null"] }
        country: { type: [string, "null"], description: Two-letter country code. }
    Contact:
      type: object
      properties:
        id: { type: integer }
        display_name: { type: string }
        company_name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        is_customer: { type: boolean }
        is_vendor: { type: boolean }
        is_employee: { type: boolean }
        invoice_emails_enabled: { type: boolean, description: Whether invoices are emailed to this contact. Opt-in; defaults to false. }
        reminder_emails_enabled: { type: boolean, description: Whether payment reminders are emailed to this contact. Opt-in; defaults to false. }
        billing_address: { $ref: '#/components/schemas/Address' }
        shipping_address: { $ref: '#/components/schemas/Address' }
        default_terms_id: { type: [integer, "null"] }
        default_tax_code_id: { type: [integer, "null"] }
    ContactInput:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string }
        company_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        tax_number: { type: string }
        notes: { type: string }
        is_active: { type: boolean }
        invoice_emails_enabled: { type: boolean, description: Opt this contact in to emailed invoices. Defaults to false. }
        reminder_emails_enabled: { type: boolean, description: Opt this contact in to payment reminders. Defaults to false. }
        billing_address: { $ref: '#/components/schemas/Address' }
        shipping_address: { $ref: '#/components/schemas/Address' }
        default_terms_id: { type: integer }
        default_tax_code_id: { type: integer }
        default_income_account_id: { type: integer }
        default_expense_account_id: { type: integer }
    InvoiceLineInput:
      type: object
      required: [quantity, unit_price_cents, account_id]
      properties:
        description: { type: string }
        quantity: { type: string, description: Decimal quantity as a string. }
        unit_price_cents: { type: integer }
        account_id: { type: integer }
        item_id: { type: integer }
        tax_code_id: { type: integer }
    InvoiceInput:
      type: object
      required: [contact_id, invoice_date, lines]
      properties:
        post: { type: boolean, default: true, description: Set false to create a draft. }
        contact_id: { type: integer }
        invoice_date: { type: string, format: date }
        due_date: { type: string, format: date }
        terms_id: { type: integer }
        memo: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/InvoiceLineInput' } }
    SalesOrderInput:
      type: object
      required: [contact_id, order_date, lines]
      properties:
        contact_id: { type: integer }
        order_date: { type: string, format: date }
        expected_date: { type: string, format: date }
        terms_id: { type: integer }
        memo: { type: string }
        customer_message: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/InvoiceLineInput' } }
    SalesOrderFulfillmentInput:
      type: object
      required: [lines]
      description: Quantities to invoice, keyed by sales_order_line_id.
      properties:
        lines:
          type: object
          additionalProperties: { type: number, description: Quantity to invoice for this line. }
    Invoice:
      type: object
      properties:
        id: { type: integer }
        invoice_no: { type: string }
        contact_id: { type: integer }
        sales_order_id: { type: [integer, "null"] }
        invoice_date: { type: string, format: date }
        due_date: { type: string, format: date }
        status: { type: string, enum: [draft, posted, partial, paid, void] }
        subtotal_cents: { type: integer }
        tax_cents: { type: integer }
        total_cents: { type: integer }
        amount_paid_cents: { type: integer }
        balance_cents: { type: integer, description: "What is still owed: total less receipts applied less any balance reconciled away by a journal entry. Prefer this over computing total_cents minus amount_paid_cents." }
        journal_entry_id: { type: [integer, "null"] }
        lines: { type: array, items: { type: object } }
    Receipt:
      type: object
      properties:
        id: { type: integer }
        receipt_no: { type: string }
        contact_id: { type: integer }
        receipt_date: { type: string, format: date }
        deposit_to_account_id: { type: integer }
        payment_method_id: { type: [integer, "null"] }
        reference: { type: [string, "null"] }
        amount_cents: { type: integer }
        unapplied_cents: { type: integer, description: "The part of amount_cents not yet applied to any invoice (the customer's credit on this receipt). To apply it, update the receipt with its full header and the complete applications list." }
        memo: { type: [string, "null"] }
        status: { type: string, enum: [draft, posted, void] }
        posted_at: { type: [string, "null"], format: date-time }
        journal_entry_id: { type: [integer, "null"] }
        applications:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              invoice_id: { type: integer }
              amount_cents: { type: integer }
    ReceiptInput:
      type: object
      required: [contact_id, receipt_date, deposit_to_account_id, amount_cents]
      properties:
        post: { type: boolean, default: true }
        contact_id: { type: integer }
        receipt_date: { type: string, format: date }
        deposit_to_account_id: { type: integer }
        payment_method_id: { type: integer }
        reference: { type: string }
        amount_cents: { type: integer }
        memo: { type: string }
        applications:
          type: array
          items:
            type: object
            required: [invoice_id, amount_cents]
            properties:
              invoice_id: { type: integer }
              amount_cents: { type: integer }
    CreditMemoInput:
      type: object
      required: [contact_id, credit_memo_date, lines]
      properties:
        post: { type: boolean, default: true }
        contact_id: { type: integer }
        credit_memo_date: { type: string, format: date }
        memo: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/InvoiceLineInput' } }
    CreditMemoRefundInput:
      type: object
      required: [refund_date, amount_cents, deposit_to_account_id]
      properties:
        refund_date: { type: string, format: date }
        amount_cents: { type: integer, minimum: 1, description: Positive amount to refund; may not exceed the memo's remaining refundable balance. }
        deposit_to_account_id: { type: integer, description: Bank or Undeposited Funds account the refund is paid from. }
        payment_method_id: { type: integer }
        reference: { type: string, maxLength: 100 }
        memo: { type: string }
    AccountInput:
      type: object
      required: [code, name, subtype]
      properties:
        code: { type: string }
        name: { type: string }
        subtype: { type: string, description: AccountSubtype value. }
        parent_id: { type: integer }
        description: { type: string }
        is_active: { type: boolean }
    JournalEntryInput:
      type: object
      required: [entry_date, lines]
      properties:
        post: { type: boolean, default: true }
        entry_date: { type: string, format: date }
        memo: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [account_id]
            properties:
              account_id: { type: integer }
              debit_cents: { type: integer }
              credit_cents: { type: integer }
              memo: { type: string }
              contact_id: { type: integer }
    Resource:
      type: object
      description: A single resource, shape varies by endpoint.
      additionalProperties: true
    GenericInput:
      type: object
      description: >
        Resource-specific body. See the matching create form in the app, or the
        relevant FormRequest, for the exact fields. Postable documents accept a
        `post` boolean (default true) to control immediate posting.
      additionalProperties: true

  requestBodies:
    Contact:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ContactInput' } } }
    Invoice:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceInput' } } }
    SalesOrder:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderInput' } } }
    SalesOrderFulfillment:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderFulfillmentInput' } } }
    Receipt:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptInput' } } }
    CreditMemo:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CreditMemoInput' } } }
    CreditMemoRefund:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CreditMemoRefundInput' } } }
    Account:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/AccountInput' } } }
    JournalEntry:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/JournalEntryInput' } } }
    Document:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/GenericInput' } } }

  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: The API key lacks the required scope.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found in this company.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: The operation conflicts with the document's lifecycle state.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Validation failed, period locked, or entry unbalanced.
      content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
    InternalError:
      description: An unexpected server error. Details are not exposed; the request can be retried later.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Contact:
      description: A contact.
      content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Contact' } } } } }
    ContactCollection:
      description: A paginated list of contacts.
      content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Contact' } }, meta: { $ref: '#/components/schemas/PaginationMeta' }, links: { type: object } } } } }
    Invoice:
      description: An invoice.
      content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Invoice' } } } } }
    InvoiceCollection:
      description: A paginated list of invoices.
      content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Invoice' } }, meta: { $ref: '#/components/schemas/PaginationMeta' }, links: { type: object } } } } }
    Document:
      description: A single resource.
