    post: { tags: [Tax], summary: Create a tax code, requestBody: {$ref: '#/components/requestBodies/TaxCode'}, responses: { '201': {$ref: '#/components/responses/TaxCode'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /tax-codes/{taxCode}:
    parameters: [{ $ref: '#/components/parameters/taxCode' }]
    get: { tags: [Tax], summary: Get a tax code, responses: { '200': {$ref: '#/components/responses/TaxCode'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Tax], summary: Update a tax code, requestBody: {$ref: '#/components/requestBodies/TaxCode'}, responses: { '200': {$ref: '#/components/responses/TaxCode'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Tax], summary: Delete a tax code }

  /tax-agencies:
    get:
      tags: [Tax]
      summary: List tax agencies
      description: "Sortable: name, id (default name asc). search matches name and registration_number. No status or date filters."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/TaxAgencyCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post: { tags: [Tax], summary: Create a tax agency, requestBody: {$ref: '#/components/requestBodies/TaxAgency'}, responses: { '201': {$ref: '#/components/responses/TaxAgency'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /tax-agencies/{taxAgency}:
    parameters: [{ $ref: '#/components/parameters/taxAgency' }]
    get: { tags: [Tax], summary: Get a tax agency, responses: { '200': {$ref: '#/components/responses/TaxAgency'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Tax], summary: Update a tax agency, requestBody: {$ref: '#/components/requestBodies/TaxAgency'}, responses: { '200': {$ref: '#/components/responses/TaxAgency'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Tax], summary: Delete a tax agency (409 if it has tax codes), responses: { '204': {description: Deleted.}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }

  /tax-returns:
    get:
      tags: [Tax]
      summary: List tax returns
      description: "Sortable: period_end, period_start, tax_return_no, net_cents, id. from/to filter period_end; status is draft, filed or void; search matches tax_return_no and filing_reference."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/TaxReturnCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post: { tags: [Tax], summary: Create a draft tax return, requestBody: {$ref: '#/components/requestBodies/TaxReturn'}, responses: { '201': {$ref: '#/components/responses/TaxReturn'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /tax-returns/{taxReturn}:
    parameters: [{ $ref: '#/components/parameters/taxReturn' }]
    get: { tags: [Tax], summary: Get a tax return, responses: { '200': {$ref: '#/components/responses/TaxReturn'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Tax], summary: "Update a draft (filed: 409)", requestBody: {$ref: '#/components/requestBodies/TaxReturn'}, responses: { '200': {$ref: '#/components/responses/TaxReturn'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Tax], summary: Delete a draft return (filed or voided returns cannot be deleted), responses: { '204': {description: Deleted.}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /tax-returns/{taxReturn}/file:
    parameters: [{ $ref: '#/components/parameters/taxReturn' }]
    post: { tags: [Tax], summary: File a draft tax return (snapshots the contributing lines), responses: { '200': {$ref: '#/components/responses/TaxReturn'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /tax-returns/{taxReturn}/void:
    parameters: [{ $ref: '#/components/parameters/taxReturn' }]
    post: { tags: [Tax], summary: Void a filed tax return (record-keeping only — no GL impact), requestBody: {$ref: '#/components/requestBodies/TaxReturnVoid'}, responses: { '200': {$ref: '#/components/responses/TaxReturn'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }

  /tax-return-payments:
    get:
      tags: [Tax]
      summary: List tax return payments
      description: "Sortable: payment_date, payment_no, total_cents, id. from/to filter payment_date; search matches payment_no and reference."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/TaxReturnPaymentCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post: { tags: [Tax], summary: Create (and post) a tax return payment, requestBody: {$ref: '#/components/requestBodies/TaxReturnPayment'}, responses: { '201': {$ref: '#/components/responses/TaxReturnPayment'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /tax-return-payments/{taxReturnPayment}:
    parameters: [{ $ref: '#/components/parameters/taxReturnPayment' }]
    get: { tags: [Tax], summary: Get a tax return payment, responses: { '200': {$ref: '#/components/responses/TaxReturnPayment'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Tax], summary: "Update a draft (posted: 409 — no repost)", requestBody: {$ref: '#/components/requestBodies/TaxReturnPayment'}, responses: { '200': {$ref: '#/components/responses/TaxReturnPayment'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Tax], summary: Void a posted payment or delete a draft, responses: { '200': {$ref: '#/components/responses/TaxReturnPayment'}, '204': {description: Draft deleted.}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /tax-return-payments/{taxReturnPayment}/post:
    parameters: [{ $ref: '#/components/parameters/taxReturnPayment' }]
    post: { tags: [Tax], summary: Post a draft tax return payment, responses: { '200': {$ref: '#/components/responses/TaxReturnPayment'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }

  # ---- Settings ----------------------------------------------------------
  /payment-terms:
    get:
      tags: [Settings]
      summary: List payment terms
      description: "Sortable: name, days, id (default days asc). search matches name. No status or date filters."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/PaymentTermCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post: { tags: [Settings], summary: Create a payment term, requestBody: {$ref: '#/components/requestBodies/PaymentTerm'}, responses: { '201': {$ref: '#/components/responses/PaymentTerm'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /payment-terms/{paymentTerm}:
    parameters: [{ $ref: '#/components/parameters/paymentTerm' }]
    get: { tags: [Settings], summary: Get a payment term, responses: { '200': {$ref: '#/components/responses/PaymentTerm'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Settings], summary: Update a payment term, requestBody: {$ref: '#/components/requestBodies/PaymentTerm'}, responses: { '200': {$ref: '#/components/responses/PaymentTerm'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Settings], summary: Delete a payment term }

  /payment-methods:
    get:
      tags: [Settings]
      summary: List payment methods
      description: "Sortable: name, id (default name asc). search matches name. No status or date filters."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/PaymentMethodCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post: { tags: [Settings], summary: Create a payment method, requestBody: {$ref: '#/components/requestBodies/PaymentMethod'}, responses: { '201': {$ref: '#/components/responses/PaymentMethod'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /payment-methods/{paymentMethod}:
    parameters: [{ $ref: '#/components/parameters/paymentMethod' }]
    get: { tags: [Settings], summary: Get a payment method, responses: { '200': {$ref: '#/components/responses/PaymentMethod'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Settings], summary: Update a payment method, requestBody: {$ref: '#/components/requestBodies/PaymentMethod'}, responses: { '200': {$ref: '#/components/responses/PaymentMethod'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Settings], summary: Delete a payment method }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <api-key>"
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key

  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1 }, description: "Page number." }
    perPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 }, description: "Items per page (capped at 100)." }
    from: { name: from, in: query, schema: { type: string, format: date }, description: "Only rows whose document date (named in the list's description) is on or after this date." }
    to: { name: to, in: query, schema: { type: string, format: date }, description: "Only rows whose document date (named in the list's description) is on or before this date." }
    status: { name: status, in: query, schema: { type: string }, description: "Exact match on the row's status (e.g. draft, posted, partial, paid, void). The values each list accepts are its status enum in the response schema." }
    search: { name: search, in: query, schema: { type: string }, description: "Case-insensitive substring match over the columns named in the list's description." }
    sort: { name: sort, in: query, schema: { type: string }, description: "Sort column; each list names its sortable columns in its description. A value that is not on that list is ignored and the default order applies." }
    direction: { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: desc }, description: "Sort direction. Only applied together with a valid sort; any value other than asc is treated as desc." }
    billType: { name: bill_type, in: query, schema: { type: string, enum: [vendor, reimbursement] }, description: "Only bills of this type." }
    accountId: { name: account_id, in: query, schema: { type: integer }, description: "Only reconciliations of this bank or credit-card account." }
    contact: { name: contact, in: path, required: true, schema: { type: integer } }
    invoice: { name: invoice, in: path, required: true, schema: { type: integer } }
    salesOrder: { name: salesOrder, in: path, required: true, schema: { type: integer } }
    receipt: { name: receipt, in: path, required: true, schema: { type: integer } }
    creditMemo: { name: creditMemo, in: path, required: true, schema: { type: integer } }
    bill: { name: bill, in: path, required: true, schema: { type: integer } }
    billPayment: { name: billPayment, in: path, required: true, schema: { type: integer } }
    cheque: { name: cheque, in: path, required: true, schema: { type: integer } }
    deposit: { name: deposit, in: path, required: true, schema: { type: integer } }
    transfer: { name: transfer, in: path, required: true, schema: { type: integer } }
    bankReconciliation: { name: bankReconciliation, in: path, required: true, schema: { type: integer } }
    account: { name: account, in: path, required: true, schema: { type: integer } }
    journalEntry: { name: journalEntry, in: path, required: true, schema: { type: integer } }
    item: { name: item, in: path, required: true, schema: { type: integer } }
    stockAdjustment: { name: stockAdjustment, in: path, required: true, schema: { type: integer } }
    taxCode: { name: taxCode, in: path, required: true, schema: { type: integer } }
    taxAgency: { name: taxAgency, in: path, required: true, schema: { type: integer } }
    taxReturn: { name: taxReturn, in: path, required: true, schema: { type: integer } }
    taxReturnPayment: { name: taxReturnPayment, in: path, required: true, schema: { type: integer } }
    asset: { name: asset, in: path, required: true, schema: { type: integer } }
    assetCategory: { name: assetCategory, in: path, required: true, schema: { type: integer } }
    paymentTerm: { name: paymentTerm, in: path, required: true, schema: { type: integer } }
    paymentMethod: { name: paymentMethod, in: path, required: true, schema: { type: integer } }

  schemas:
    # ---- Envelopes & errors ---------------------------------------------
    Error:
      type: object
      properties:
        message: { type: string }
      required: [message]
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
      required: [message]
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    PaginationLinks:
      type: object
      properties:
        first: { type: [string, "null"] }
        last: { type: [string, "null"] }
        prev: { type: [string, "null"] }
        next: { type: [string, "null"] }

    # ---- Shared fragments -----------------------------------------------
    Address:
      type: object
      properties:
        line1: { type: [string, "null"], maxLength: 255 }
        line2: { type: [string, "null"], maxLength: 255 }
        city: { type: [string, "null"], maxLength: 255 }
        region: { type: [string, "null"], maxLength: 255 }
        postal_code: { type: [string, "null"], maxLength: 255 }
        country: { type: [string, "null"], minLength: 2, maxLength: 2, description: "Two-letter country code." }
    DocumentLine:
      type: object
      description: A priced line on an invoice, credit memo or bill.
      properties:
        id: { type: integer }
        description: { type: [string, "null"] }
        quantity: { type: string, description: "Decimal quantity as a string." }
        unit_price_cents: { type: integer }
        account_id: { type: integer }
        item_id: { type: [integer, "null"] }
        tax_code_id: { type: [integer, "null"] }
        secondary_tax_code_id: { type: [integer, "null"] }
        line_subtotal_cents: { type: integer }
        line_tax_cents: { type: integer }
        secondary_tax_cents: { type: integer }
        line_total_cents: { type: integer }
    DocumentLineInput:
      type: object
      description: A priced line for a sales order, credit memo or bill. Between 1 and 1000 lines per document.
      required: [quantity, unit_price_cents, account_id]
      properties:
        description: { type: [string, "null"], maxLength: 1000 }
        quantity: { type: [string, number], description: "Decimal quantity, greater than 0 and at most 1,000,000." }
        unit_price_cents: { type: integer, minimum: 0, maximum: 999999999999 }
        account_id: { type: integer }
        item_id: { type: [integer, "null"] }
        tax_code_id: { type: [integer, "null"] }
        secondary_tax_code_id: { type: [integer, "null"], description: "Second tax on the same line (e.g. QST alongside GST)." }
    InvoiceLineInput:
      type: object
      description: >
        A priced line on an invoice. Between 1 and 1000 lines per invoice. Unlike
        the other documents, unit_price_cents MAY BE NEGATIVE — a discount or
        credit recorded as its own line — while quantity stays positive (the sign
        lives on the price). The lines as a whole must still net to a total
        greater than zero; a payload whose lines net to zero or to a credit is
        refused with 422 ("Use a credit memo for a net credit"). A leg that nets
        negative is posted as a debit to its account.
      required: [quantity, unit_price_cents, account_id]
      properties:
        description: { type: [string, "null"], maxLength: 1000 }
        quantity: { type: [string, number], description: "Decimal quantity, greater than 0 and at most 1,000,000." }
        unit_price_cents: { type: integer, minimum: -999999999999, maximum: 999999999999, description: "May be negative (discount / credit line); the invoice total must still be greater than zero." }
        account_id: { type: integer }
        item_id: { type: [integer, "null"] }
        tax_code_id: { type: [integer, "null"] }
        secondary_tax_code_id: { type: [integer, "null"], description: "Second tax on the same line (e.g. QST alongside GST)." }

    # ---- Contacts -------------------------------------------------------
    Contact:
      type: object
      properties:
        id: { type: integer }
        display_name: { type: string }
        company_name: { type: [string, "null"] }
        first_name: { type: [string, "null"] }
        last_name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        tax_number: { type: [string, "null"] }
        is_customer: { type: boolean }
        is_vendor: { type: boolean }
        is_employee: { type: boolean }
        invoice_emails_enabled: { type: boolean, description: "Whether invoices are emailed to this contact. Opt-in; defaults to false." }
        reminder_emails_enabled: { type: boolean, description: "Whether payment reminders are emailed to this contact. Opt-in; defaults to false." }
        billing_address: { $ref: '#/components/schemas/Address' }
        shipping_address: { $ref: '#/components/schemas/Address' }
        default_terms_id: { type: [integer, "null"] }
        default_tax_code_id: { type: [integer, "null"] }
        default_income_account_id: { type: [integer, "null"] }
        notes: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
    ContactInput:
      type: object
      description: >
        The role (customer, vendor, employee) comes from the endpoint the contact
        is created through, not from the body. account_no, is_active and
        default_expense_account_id are accepted and stored but not echoed in the
        response.
      required: [display_name]
      properties:
        display_name: { type: string, maxLength: 255 }
        company_name: { type: [string, "null"], maxLength: 255 }
        account_no: { type: [string, "null"], maxLength: 100, description: "Your reference number for this contact." }
        first_name: { type: [string, "null"], maxLength: 255 }
        last_name: { type: [string, "null"], maxLength: 255 }
        email: { type: [string, "null"], format: email, maxLength: 255 }
        phone: { type: [string, "null"], maxLength: 255 }
        tax_number: { type: [string, "null"], maxLength: 255 }
        notes: { type: [string, "null"] }
        is_active: { type: boolean }
        invoice_emails_enabled: { type: boolean, description: "Opt this contact in to emailed invoices. Defaults to false." }
        reminder_emails_enabled: { type: boolean, description: "Opt this contact in to payment reminders. Defaults to false." }
        billing_address: { $ref: '#/components/schemas/Address' }
        shipping_address: { $ref: '#/components/schemas/Address' }
        default_terms_id: { type: [integer, "null"], description: "An active payment term." }
        default_tax_code_id: { type: [integer, "null"], description: "An active tax code." }
        default_income_account_id: { type: [integer, "null"], description: "An active income account." }
        default_expense_account_id: { type: [integer, "null"], description: "An active expense account." }

    # ---- Sales orders ---------------------------------------------------
    SalesOrder:
      type: object
      properties:
        id: { type: integer }
        order_no: { type: string }
        contact_id: { type: integer }
        order_date: { type: string, format: date }
        expected_date: { type: [string, "null"], format: date }
        terms_id: { type: [integer, "null"] }
        status: { type: string, enum: [open, partial, closed, cancelled], description: "Derived: partial once any line is invoiced, closed once every line is." }
        subtotal_cents: { type: integer }
        tax_cents: { type: integer }
        total_cents: { type: integer }
        memo: { type: [string, "null"] }
        customer_message: { type: [string, "null"] }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              description: { type: [string, "null"] }
              qty_ordered: { type: string }
              qty_invoiced: { type: string }
              qty_backordered: { type: string }
              unit_price_cents: { type: integer }
              account_id: { type: integer }
              item_id: { type: [integer, "null"] }
              tax_code_id: { type: [integer, "null"] }
              secondary_tax_code_id: { type: [integer, "null"] }
              line_subtotal_cents: { type: integer }
              line_tax_cents: { type: integer }
              secondary_tax_cents: { type: integer }
              line_total_cents: { type: integer }
    SalesOrderInput:
      type: object
      required: [contact_id, order_date, lines]
      properties:
        contact_id: { type: integer, description: "A customer contact." }
        order_date: { type: string, format: date }
        expected_date: { type: [string, "null"], format: date, description: "On or after order_date." }
        terms_id: { type: [integer, "null"] }
        memo: { type: [string, "null"] }
        customer_message: { type: [string, "null"] }
        lines: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/DocumentLineInput' } }
    SalesOrderFulfillmentInput:
      type: object
      required: [lines]
      description: Quantities to invoice, keyed by sales_order_line_id. Over-fulfilment and unknown line ids are refused with 422.
      properties:
        lines:
          type: object
          minProperties: 1
          additionalProperties: { type: number, exclusiveMinimum: 0, maximum: 1000000, description: "Quantity to invoice for this line." }

    # ---- Invoices -------------------------------------------------------
    Invoice:
      type: object
      properties:
        id: { type: integer }
        invoice_no: { type: string }
        contact_id: { type: integer }
        sales_rep_id: { type: [integer, "null"] }
        sales_order_id: { type: [integer, "null"] }
        invoice_date: { type: string, format: date }
        due_date: { type: [string, "null"], format: date }
        terms_id: { type: [integer, "null"] }
        form_style_id: { type: [integer, "null"] }
        status: { type: string, enum: [draft, posted, partial, paid, void] }
        subtotal_cents: { type: integer }
        tax_cents: { type: integer }
        total_cents: { type: integer }
        amount_paid_cents: { type: integer }
        balance_cents: { type: integer, description: "What is still owed: total less receipts applied less any balance reconciled away by a journal entry. Prefer this over computing total_cents minus amount_paid_cents." }
        memo: { type: [string, "null"] }
        posted_at: { type: [string, "null"], format: date-time }
        journal_entry_id: { type: [integer, "null"] }
        lines: { type: array, items: { $ref: '#/components/schemas/DocumentLine' } }
    InvoiceInput:
      type: object
      required: [contact_id, invoice_date, lines]
      properties:
        post: { type: boolean, default: true, description: "Set false to create a draft. Create only." }
        invoice_no: { type: [string, "null"], maxLength: 50, description: "Create only; must be unique within the company. Omit for the next number in sequence." }
        contact_id: { type: integer, description: "A customer contact." }
        sales_rep_id: { type: [integer, "null"], description: "Employee contact credited with the sale. Must be a contact with is_employee set; reps only surface in the UI when the Employees feature is on." }
        invoice_date: { type: string, format: date }
        due_date: { type: [string, "null"], format: date, description: "On or after invoice_date." }
        terms_id: { type: [integer, "null"] }
        form_style_id: { type: [integer, "null"], description: "The form style used when the invoice is printed or emailed." }
        memo: { type: [string, "null"] }
        lines: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/InvoiceLineInput' } }

    # ---- Receipts -------------------------------------------------------
    Receipt:
      type: object
      properties:
        id: { type: integer }
        receipt_no: { type: string }
        contact_id: { type: integer }
        receipt_date: { type: string, format: date }
        deposit_to_account_id: { type: integer }
        payment_method_id: { type: [integer, "null"] }
        reference: { type: [string, "null"] }
        amount_cents: { type: integer, description: "Negative on a refund receipt created through /credit-memos/{creditMemo}/refund." }
        unapplied_cents: { type: integer, description: "The part of amount_cents not yet applied to any invoice (the customer's credit on this receipt). To apply it, update the receipt with its full header and the complete applications list." }
        memo: { type: [string, "null"] }
        status: { type: string, enum: [draft, posted, void] }
        posted_at: { type: [string, "null"], format: date-time }
        journal_entry_id: { type: [integer, "null"] }
        applications:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              invoice_id: { type: integer }
              amount_cents: { type: integer }
    ReceiptInput:
      type: object
      required: [contact_id, receipt_date, deposit_to_account_id, amount_cents]
      properties:
        post: { type: boolean, default: true, description: "Create only." }
        receipt_no: { type: [string, "null"], maxLength: 50, description: "Create only; must be unique within the company. Omit for the next number in sequence." }
        contact_id: { type: integer, description: "A customer contact." }
        receipt_date: { type: string, format: date }
        deposit_to_account_id: { type: integer, description: "Bank or Undeposited Funds account." }
        payment_method_id: { type: [integer, "null"] }
        reference: { type: [string, "null"], maxLength: 100 }
        amount_cents: { type: integer, minimum: 1, maximum: 999999999999 }
        memo: { type: [string, "null"] }
        applications:
          type: array
          maxItems: 1000
          description: "Invoices this receipt pays. The sum may not exceed amount_cents and every invoice must belong to contact_id. On create the invoice must be posted or partial; on update paid is also accepted (the receipt being edited may already have driven it to paid)."
          items:
            type: object
            required: [invoice_id, amount_cents]
            properties:
              invoice_id: { type: integer }
              amount_cents: { type: integer, minimum: 1 }

    # ---- Credit memos ---------------------------------------------------
    CreditMemo:
      type: object
      properties:
        id: { type: integer }
        credit_memo_no: { type: string }
        contact_id: { type: integer }
        sales_rep_id: { type: [integer, "null"] }
        credit_memo_date: { type: string, format: date }
        status: { type: string, enum: [draft, posted, void] }
        subtotal_cents: { type: integer }
        tax_cents: { type: integer }
        total_cents: { type: integer }
        memo: { type: [string, "null"] }
        posted_at: { type: [string, "null"], format: date-time }
        journal_entry_id: { type: [integer, "null"] }
        lines: { type: array, items: { $ref: '#/components/schemas/DocumentLine' } }
    CreditMemoInput:
      type: object
      required: [contact_id, credit_memo_date, lines]
      properties:
        post: { type: boolean, default: true, description: "Create only." }
        credit_memo_no: { type: [string, "null"], maxLength: 50, description: "Create only; must be unique within the company. Omit for the next number in sequence." }
        contact_id: { type: integer, description: "A customer contact." }
        sales_rep_id: { type: [integer, "null"], description: "Employee contact credited with the sale. Must be a contact with is_employee set; reps only surface in the UI when the Employees feature is on." }
        credit_memo_date: { type: string, format: date }
        memo: { type: [string, "null"] }
        lines: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/DocumentLineInput' } }
    CreditMemoRefundInput:
      type: object
      required: [refund_date, amount_cents, deposit_to_account_id]
      properties:
        refund_date: { type: string, format: date }
        receipt_no: { type: [string, "null"], maxLength: 50, description: "Number for the refund receipt that is created; must be unique within the company. Omit for the next number in sequence." }
        amount_cents: { type: integer, minimum: 1, maximum: 999999999999, description: "Positive amount to refund; may not exceed the memo's remaining refundable balance." }
        deposit_to_account_id: { type: integer, description: "Bank or Undeposited Funds account the refund is paid from." }
        payment_method_id: { type: [integer, "null"] }
        reference: { type: [string, "null"], maxLength: 100 }
        memo: { type: [string, "null"] }

    # ---- Bills ----------------------------------------------------------
    Bill:
      type: object
      properties:
        id: { type: integer }
        bill_no: { type: string }
        bill_type: { type: string, enum: [vendor, reimbursement] }
        contact_id: { type: integer }
        vendor_reference: { type: [string, "null"] }
        bill_date: { type: string, format: date }
        due_date: { type: [string, "null"], format: date }
        terms_id: { type: [integer, "null"] }
        status: { type: string, enum: [draft, posted, partial, paid, void] }
        subtotal_cents: { type: integer }
        tax_cents: { type: integer }
        total_cents: { type: integer }
        amount_paid_cents: { type: integer }
        memo: { type: [string, "null"] }
        posted_at: { type: [string, "null"], format: date-time }
        journal_entry_id: { type: [integer, "null"] }
        lines: { type: array, items: { $ref: '#/components/schemas/DocumentLine' } }
    BillInput:
      type: object
      required: [contact_id, bill_date, lines]
      properties:
        post: { type: boolean, default: true, description: "Create only." }
        bill_type: { type: string, enum: [vendor, reimbursement], default: vendor, description: "Create only. A reimbursement is owed to an employee; a vendor bill to a vendor." }
        bill_no: { type: [string, "null"], maxLength: 40, description: "Create only; must be unique within the company. Omit for the next number in sequence." }
        contact_id: { type: integer, description: "A vendor contact — or an employee contact when bill_type is reimbursement." }
        vendor_reference: { type: [string, "null"], maxLength: 100, description: "The supplier's own invoice number." }
        bill_date: { type: string, format: date }
        due_date: { type: [string, "null"], format: date, description: "On or after bill_date." }
        terms_id: { type: [integer, "null"] }
        memo: { type: [string, "null"] }
        lines: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/DocumentLineInput' } }

    # ---- Bill payments --------------------------------------------------
    BillPayment:
      type: object
      properties:
        id: { type: integer }
        payment_no: { type: string }
        payment_type: { type: string, enum: [vendor, reimbursement] }
        contact_id: { type: integer }
        payment_date: { type: string, format: date }
        paid_from_account_id: { type: integer }
        payment_method_id: { type: [integer, "null"] }
        reference: { type: [string, "null"] }
        amount_cents: { type: integer }
        memo: { type: [string, "null"] }
        status: { type: string, enum: [draft, posted, void] }
        posted_at: { type: [string, "null"], format: date-time }
        journal_entry_id: { type: [integer, "null"] }
        applications:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              bill_id: { type: integer }
              amount_cents: { type: integer }
    BillPaymentInput:
      type: object
      required: [contact_id, payment_date, paid_from_account_id, amount_cents]
      properties:
        post: { type: boolean, default: true, description: "Create only." }
        payment_type: { type: string, enum: [vendor, reimbursement], default: vendor, description: "Create only; must match the bills being paid." }
        payment_no: { type: [string, "null"], maxLength: 40, description: "Create only; must be unique within the company. Omit for the next number in sequence." }
        contact_id: { type: integer, description: "A vendor contact — or an employee contact when payment_type is reimbursement." }
        payment_date: { type: string, format: date }
        paid_from_account_id: { type: integer, description: "Bank or credit-card account the payment comes from." }
        payment_method_id: { type: [integer, "null"] }
        reference: { type: [string, "null"], maxLength: 100 }
        amount_cents: { type: integer, minimum: 1, maximum: 999999999999 }
        memo: { type: [string, "null"] }
        applications:
          type: array
          maxItems: 1000
          description: "Bills this payment settles. The sum may not exceed amount_cents; each bill must belong to contact_id, be of payment_type and be open (posted or partial; paid is also accepted on update)."
          items:
            type: object
            required: [bill_id, amount_cents]
            properties:
              bill_id: { type: integer }
              amount_cents: { type: integer, minimum: 1 }

    # ---- Cheques --------------------------------------------------------
    ChequeLine:
      type: object
      properties:
        id: { type: integer }
        account_id: { type: integer }
        contact_id: { type: [integer, "null"], description: "The customer or vendor whose receivable / payable this line settles." }
        description: { type: [string, "null"] }
        amount_cents: { type: integer }
        tax_code_id: { type: [integer, "null"] }
        secondary_tax_code_id: { type: [integer, "null"] }
        tax_cents: { type: integer }
        secondary_tax_cents: { type: integer }
    ChequeLineInput:
      type: object
      description: >
        Lines with amount_cents of 0 are dropped. A line coded to the Accounts
        Receivable control account must carry the customer's contact_id, and a
        line coded to Accounts Payable the vendor's; that rule is enforced when
        the cheque is posted (POST with post=true, or PATCH of a posted cheque),
        not while it is a draft. Every tax field is ignored on such a control-
        account line: the receivable or payable already includes the tax its
        invoice or bill recorded, so taxing the settlement again would
        double-count it.
      required: [account_id, amount_cents]
      properties:
        account_id: { type: integer }
        contact_id: { type: [integer, "null"], description: "Customer (AR line) or vendor (AP line) whose sub-ledger this line moves; distinct from the header payee." }
        description: { type: [string, "null"], maxLength: 1000 }
        amount_cents: { type: integer, minimum: 0, maximum: 999999999999 }
        tax_code_id: { type: [integer, "null"], description: "Ignored on an AR / AP control-account line." }
        secondary_tax_code_id: { type: [integer, "null"], description: "Ignored on an AR / AP control-account line." }
    Cheque:
      type: object
      properties:
        id: { type: integer }
        cheque_no: { type: string }
        bank_account_id: { type: integer }
        cheque_date: { type: string, format: date }
        payee_contact_id: { type: [integer, "null"] }
        payee_name: { type: [string, "null"] }
        credit_memo_id: { type: [integer, "null"], description: "Set when the cheque refunds a credit memo." }
        memo: { type: [string, "null"] }
        amount_cents: { type: integer, description: "Sum of the lines including tax." }
        status: { type: string, enum: [draft, posted, void] }
        posted_at: { type: [string, "null"], format: date-time }
        journal_entry_id: { type: [integer, "null"] }
        payee_address: { $ref: '#/components/schemas/Address', description: "The mailing address snapshotted onto the cheque." }
        lines: { type: array, items: { $ref: '#/components/schemas/ChequeLine' } }
    ChequeInput:
      type: object
      required: [bank_account_id, cheque_no, cheque_date, lines]
      properties:
        post: { type: boolean, default: true, description: "Create only." }
        bank_account_id: { type: integer, description: "An account with subtype bank." }
        cheque_no: { type: string, maxLength: 40, description: "Required. Not unique — the same number may be reused (e.g. across bank accounts or after a void); accepted on update too." }
        cheque_date: { type: string, format: date }
        payee_contact_id: { type: [integer, "null"] }
        payee_name: { type: [string, "null"], maxLength: 255, description: "Required unless payee_contact_id is given; then it defaults to that contact's display name." }
        memo: { type: [string, "null"] }
        payee_address:
          allOf: [{ $ref: '#/components/schemas/Address' }]
          description: "Mailing address snapshotted onto the cheque. Omit the key and the payee contact's billing address is used; send it (even with null fields) to override."
        lines: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/ChequeLineInput' } }

    # ---- Deposits -------------------------------------------------------
    Deposit:
      type: object
      properties:
        id: { type: integer }
        deposit_no: { type: string }
        bank_account_id: { type: integer }
        deposit_date: { type: string, format: date }
        memo: { type: [string, "null"] }
        amount_cents: { type: integer }
        status: { type: string, enum: [draft, posted, void] }
        posted_at: { type: [string, "null"], format: date-time }
        journal_entry_id: { type: [integer, "null"] }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              customer_receipt_id: { type: [integer, "null"] }
              account_id: { type: [integer, "null"] }
              contact_id: { type: [integer, "null"] }
              description: { type: [string, "null"] }
              amount_cents: { type: integer }
    DepositInput:
      type: object
      required: [bank_account_id, deposit_date, lines]
      properties:
        post: { type: boolean, default: true, description: "Create only." }
        bank_account_id: { type: integer, description: "An account with subtype bank." }
        deposit_no: { type: [string, "null"], maxLength: 40, description: "Must be unique within the company; accepted on update too. Omit for the next number in sequence." }
        deposit_date: { type: string, format: date }
        memo: { type: [string, "null"] }
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          description: "Each line is either a receipt being deposited from Undeposited Funds (customer_receipt_id; amount_cents defaults to the receipt's amount when omitted) or an 'other' line credited to account_id, which then requires amount_cents."
          items:
            type: object
            properties:
              customer_receipt_id: { type: [integer, "null"] }
              account_id: { type: [integer, "null"], description: "Required when customer_receipt_id is absent." }
              contact_id: { type: [integer, "null"] }
              description: { type: [string, "null"], maxLength: 1000 }
              amount_cents: { type: [integer, "null"], minimum: 1, maximum: 999999999999, description: "Required on an account line. On a receipt line it defaults to the receipt's amount when omitted; a supplied value is used as sent." }

    # ---- Transfers ------------------------------------------------------
    Transfer:
      type: object
      properties:
        id: { type: integer }
        transfer_no: { type: [string, "null"] }
        from_account_id: { type: integer }
        to_account_id: { type: integer }
        transfer_date: { type: string, format: date }
        memo: { type: [string, "null"] }
        from_amount_cents: { type: integer, description: "Amount leaving from_account_id, in that account's currency." }
        to_amount_cents: { type: integer, description: "Amount arriving in to_account_id, in that account's currency." }
        from_currency_code: { type: [string, "null"] }
        to_currency_code: { type: [string, "null"] }
        from_fx_rate: { type: [string, number, "null"], description: "Decimal rate locked at posting; null for a home-currency account." }
        to_fx_rate: { type: [string, number, "null"], description: "Decimal rate locked at posting; null for a home-currency account." }
        home_amount_cents: { type: [integer, "null"], description: "The home-currency amount posted to the ledger; null until posted." }
        status: { type: string, enum: [draft, posted, void] }
        posted_at: { type: [string, "null"], format: date-time }
        journal_entry_id: { type: [integer, "null"] }
    TransferInput:
      type: object
      description: >
        Moves money between two of the company's bank or credit-card accounts.
        For two accounts in the same currency send the same value in both amount
        fields. For a cross-currency transfer send each side in its own account's
        currency; the rate is **not** derived from the pair. Each foreign side is
        converted to home currency at the company's exchange rate for that
        account's currency on `transfer_date` (locked into `from_fx_rate` /
        `to_fx_rate` at posting), and any difference between the two home values
        is posted as a realized gain or loss to the company's Exchange Gain/Loss
        account — which must exist, or posting fails with **422**.
      required: [from_account_id, to_account_id, transfer_date, from_amount_cents, to_amount_cents]
      properties:
        post: { type: boolean, default: true, description: "Create only." }
        from_account_id: { type: integer, description: "An account with subtype bank or credit_card." }
        to_account_id: { type: integer, description: "An account with subtype bank or credit_card; must differ from from_account_id." }
        transfer_no: { type: [string, "null"], maxLength: 40, description: "Create only; ignored on update. Omit for the next number in sequence." }
        transfer_date: { type: string, format: date }
        from_amount_cents: { type: integer, minimum: 1, maximum: 999999999999 }
        to_amount_cents: { type: integer, minimum: 1, maximum: 999999999999 }
        memo: { type: [string, "null"] }

    # ---- Bank reconciliations -------------------------------------------
    BankReconciliation:
      type: object
      properties:
        id: { type: integer }
        account_id: { type: integer }
        statement_date: { type: string, format: date }
        beginning_balance_cents: { type: integer }
        ending_balance_cents: { type: integer }
        service_charge_cents: { type: integer }
        service_charge_date: { type: [string, "null"], format: date }
        service_charge_account_id: { type: [integer, "null"] }
        service_charge_entry_id: { type: [integer, "null"], description: "Journal entry posted for the service charge." }
        interest_earned_cents: { type: integer }
        interest_earned_date: { type: [string, "null"], format: date }
        interest_earned_account_id: { type: [integer, "null"] }
        interest_earned_entry_id: { type: [integer, "null"], description: "Journal entry posted for the interest." }
        status: { type: string, enum: [in_progress, completed] }
        marked_line_ids: { type: array, items: { type: integer }, description: "Journal line ids currently marked as cleared candidates." }
        completed_at: { type: [string, "null"], format: date-time }
        completed_by_user_id: { type: [integer, "null"] }
    BankReconciliationBeginInput:
      type: object
      required: [account_id, statement_date, ending_balance_cents]
      properties:
        account_id: { type: integer, description: "An account with subtype bank or credit_card." }
        statement_date: { type: string, format: date }
        ending_balance_cents: { type: integer, minimum: -999999999999, maximum: 999999999999 }
        service_charge:
          type: [object, "null"]
          description: Posts a service-charge journal entry when the session opens. Can only be set here, not later.
          required: [cents, account_id]
          properties:
            cents: { type: integer, minimum: 1 }
            date: { type: [string, "null"], format: date, description: "Defaults to statement_date." }
            account_id: { type: integer, description: "Expense account for the charge." }
        interest_earned:
          type: [object, "null"]
          description: Posts an interest-earned journal entry when the session opens. Can only be set here, not later.
          required: [cents, account_id]
          properties:
            cents: { type: integer, minimum: 1 }
            date: { type: [string, "null"], format: date, description: "Defaults to statement_date." }
            account_id: { type: integer, description: "Income account for the interest." }
    BankReconciliationUpdateInput:
      type: object
      required: [marked_line_ids]
      properties:
        marked_line_ids:
          type: array
          maxItems: 100000
          description: "The complete replacement set of journal line ids to mark as cleared candidates. Every id must be a journal line on the reconciliation's account. Send [] to unmark everything."
          items: { type: integer }

    # ---- Accounts -------------------------------------------------------
    Account:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [asset, liability, equity, income, expense] }
        subtype: { $ref: '#/components/schemas/AccountSubtype' }
        normal_balance: { type: string, enum: [debit, credit] }
        currency_code: { type: [string, "null"], description: "Null for a home-currency account." }
        parent_id: { type: [integer, "null"] }
        default_tax_code_id: { type: [integer, "null"] }
        description: { type: [string, "null"] }
        cash_flow_activity: { type: [string, "null"], enum: [operating, investing, financing, null] }
        is_system: { type: boolean, description: "System accounts (control accounts) can be renamed but not otherwise changed or deleted." }
        is_active: { type: boolean }
        balance_cents: { type: integer, description: "Posted balance in the account's normal-balance sense." }
        created_at: { type: [string, "null"], format: date-time }
    AccountSubtype:
      type: string
      description: The account's subtype; the type and normal balance follow from it.
      enum:
        - bank
        - accounts_receivable
        - undeposited_funds
        - inventory
        - current_asset
        - fixed_asset
        - other_asset
        - accounts_payable
        - credit_card
        - tax_payable
        - current_liability
        - long_term_liability
        - other_liability
        - equity
        - retained_earnings
        - unrestricted_net_assets
        - restricted_net_assets
        - endowment_net_assets
        - income
        - other_income
        - cost_of_goods_sold
        - expense
        - other_expense
    AccountInput:
      type: object
      required: [code, name, subtype]
      properties:
        code: { type: string, maxLength: 20, description: "Unique within the company." }
        name: { type: string, maxLength: 255 }
        subtype: { $ref: '#/components/schemas/AccountSubtype' }
        parent_id: { type: [integer, "null"], description: "A parent account of a compatible subtype (validated)." }
        description: { type: [string, "null"] }
        cash_flow_activity: { type: [string, "null"], enum: [operating, investing, financing, null], description: "Section of the cash-flow statement this account reports under." }
        default_tax_code_id: { type: [integer, "null"], description: "Tax code pre-selected when this account is chosen on a line." }
        currency_code: { type: [string, "null"], description: "Three-letter code of one of the company's enabled foreign currencies (case-insensitive). Null or omitted means the home currency." }
        is_active: { type: boolean }

    # ---- Journal entries ------------------------------------------------
    JournalEntry:
      type: object
      properties:
        id: { type: integer }
        entry_no: { type: [string, "null"] }
        entry_date: { type: string, format: date }
        memo: { type: [string, "null"] }
        is_posted: { type: boolean }
        status: { type: string, enum: [draft, posted, void] }
        total_debits_cents: { type: integer }
        total_credits_cents: { type: integer }
        posted_at: { type: [string, "null"], format: date-time }
        voided_at: { type: [string, "null"], format: date-time }
        reversed_by_entry_id: { type: [integer, "null"], description: "The reversing entry written when this one was voided." }
        reverses_entry_id: { type: [integer, "null"], description: "Set on a reversing entry, pointing at the entry it voids." }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              account_id: { type: integer }
              contact_id: { type: [integer, "null"] }
              tax_code_id: { type: [integer, "null"] }
              debit_cents: { type: integer }
              credit_cents: { type: integer }
              memo: { type: [string, "null"] }
    JournalEntryInput:
      type: object
      required: [entry_date, lines]
      properties:
        post: { type: boolean, default: true, description: "Create only." }
        entry_no: { type: [string, "null"], maxLength: 40, description: "Accepted on create and update. Omit for the next number in sequence." }
        entry_date: { type: string, format: date }
        memo: { type: [string, "null"] }
        lines:
          type: array
          minItems: 2
          maxItems: 1000
          description: "Debits must equal credits (422 otherwise). A line on the Accounts Receivable control account must name a customer in contact_id, and a line on Accounts Payable a vendor."
          items:
            type: object
            required: [account_id, debit_cents, credit_cents]
            properties:
              account_id: { type: integer }
              debit_cents: { type: integer, minimum: 0, maximum: 999999999999 }
              credit_cents: { type: integer, minimum: 0, maximum: 999999999999 }
              memo: { type: [string, "null"], maxLength: 1000 }
              contact_id: { type: [integer, "null"] }
              tax_code_id: { type: [integer, "null"], description: "Tags the line for the sales-tax return." }

    # ---- Fixed assets ---------------------------------------------------
    Asset:
      type: object
      properties:
        id: { type: integer }
        asset_no: { type: [string, "null"] }
        name: { type: string }
        description: { type: [string, "null"] }
        asset_category_id: { type: [integer, "null"] }
        asset_account_id: { type: integer }
        accumulated_depreciation_account_id: { type: [integer, "null"] }
        depreciation_expense_account_id: { type: [integer, "null"] }
        serial_number: { type: [string, "null"] }
        location: { type: [string, "null"] }
        acquired_date: { type: string, format: date }
        in_service_date: { type: [string, "null"], format: date }
        cost_cents: { type: integer }
        salvage_value_cents: { type: integer }
        useful_life_months: { type: [integer, "null"] }
        status: { type: string, enum: [in-service, disposed, sold, lost] }
        disposed_at: { type: [string, "null"], format: date }
        disposal_notes: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        is_active: { type: boolean }
        source_type: { type: [string, "null"], description: "The document the asset was created from, if any." }
        source_id: { type: [integer, "null"] }
        created_at: { type: [string, "null"], format: date-time }
    AssetInput:
      type: object
      required: [name, asset_account_id, acquired_date, cost_cents]
      properties:
        asset_no: { type: string, maxLength: 40, description: "Create only; must be unique within the company. Omit for the next number in sequence." }
        name: { type: string, maxLength: 255 }
        description: { type: [string, "null"] }
        asset_category_id: { type: [integer, "null"] }
        asset_account_id: { type: integer, description: "An account with subtype fixed_asset." }
        accumulated_depreciation_account_id: { type: [integer, "null"] }
        depreciation_expense_account_id: { type: [integer, "null"] }
        serial_number: { type: [string, "null"], maxLength: 255 }
        location: { type: [string, "null"], maxLength: 255 }
        acquired_date: { type: string, format: date }
        in_service_date: { type: [string, "null"], format: date }
        cost_cents: { type: integer, minimum: 0, maximum: 999999999999 }
        salvage_value_cents: { type: [integer, "null"], minimum: 0, maximum: 999999999999 }
        useful_life_months: { type: [integer, "null"], minimum: 1, maximum: 1200 }
        status: { type: string, enum: [in-service, disposed, sold, lost] }
        disposed_at: { type: [string, "null"], format: date, description: "Required when status is disposed, sold or lost." }
        disposal_notes: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        is_active: { type: boolean }
    AssetCategory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, "null"] }
        default_asset_account_id: { type: [integer, "null"] }
        default_accumulated_depreciation_account_id: { type: [integer, "null"] }
        default_depreciation_expense_account_id: { type: [integer, "null"] }
        default_useful_life_months: { type: [integer, "null"] }
        is_active: { type: boolean }
        created_at: { type: [string, "null"], format: date-time }
    AssetCategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255, description: "Unique within the company." }
        description: { type: [string, "null"] }
        default_asset_account_id: { type: [integer, "null"], description: "An account with subtype fixed_asset." }
        default_accumulated_depreciation_account_id: { type: [integer, "null"], description: "An account with subtype fixed_asset." }
        default_depreciation_expense_account_id: { type: [integer, "null"], description: "An expense account." }
        default_useful_life_months: { type: [integer, "null"], minimum: 1, maximum: 1200 }
        is_active: { type: boolean }

    # ---- Items & stock --------------------------------------------------
    Item:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        sku: { type: [string, "null"] }
        description: { type: [string, "null"] }
        income_account_id: { type: integer }
        expense_account_id: { type: [integer, "null"] }
        default_tax_code_id: { type: [integer, "null"] }
        default_secondary_tax_code_id: { type: [integer, "null"] }
        default_price_cents: { type: integer }
        track_inventory: { type: boolean }
        inventory_asset_account_id: { type: [integer, "null"] }
        cogs_account_id: { type: [integer, "null"] }
        reorder_point: { type: [string, "null"], description: "Decimal quantity as a string." }
        qty_on_hand: { type: string, description: "Decimal quantity as a string (cached)." }
        unit_cost_cents: { type: integer, description: "Current average unit cost (cached)." }
        is_active: { type: boolean }
        created_at: { type: [string, "null"], format: date-time }
    ItemInput:
      type: object
      required: [name, income_account_id]
      properties:
        name: { type: string, maxLength: 255 }
        sku: { type: [string, "null"], maxLength: 100 }
        description: { type: [string, "null"] }
        income_account_id: { type: integer }
        expense_account_id: { type: [integer, "null"] }
        default_tax_code_id: { type: [integer, "null"] }
        default_secondary_tax_code_id: { type: [integer, "null"] }
        default_price_cents: { type: [integer, "null"], minimum: 0, maximum: 999999999999 }
        is_active: { type: boolean }
        track_inventory: { type: boolean, default: false }
        inventory_asset_account_id: { type: [integer, "null"], description: "Required when track_inventory is true." }
        cogs_account_id: { type: [integer, "null"], description: "Required when track_inventory is true." }
        reorder_point: { type: [string, number, "null"], description: "Decimal quantity ≥ 0." }
        opening_qty: { type: [string, number, "null"], description: "Opening quantity on hand ≥ 0 (tracked items)." }
        opening_cost_cents: { type: [integer, "null"], minimum: 0, maximum: 999999999999, description: "Opening cost per unit for opening_qty." }
    StockAdjustment:
      type: object
      properties:
        id: { type: integer }
        adjustment_no: { type: [string, "null"] }
        adjustment_date: { type: string, format: date }
        reason: { type: string, enum: [opening_balance, shrinkage, damage, recount, write_off, other] }
        notes: { type: [string, "null"] }
        journal_entry_id: { type: [integer, "null"] }
        posted_at: { type: [string, "null"], format: date-time }
        voided_at: { type: [string, "null"], format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              item_id: { type: integer }
              qty_change: { type: string, description: "Signed decimal quantity as a string." }
              unit_cost_cents: { type: integer }
              notes: { type: [string, "null"] }
    StockAdjustmentInput:
      type: object
      required: [adjustment_date, reason, lines]
      properties:
        post: { type: boolean, default: true, description: "Create only." }
        adjustment_no: { type: string, maxLength: 40, description: "Create only; must be unique within the company. Omit for the next number in sequence." }
        adjustment_date: { type: string, format: date }
        reason: { type: string, enum: [opening_balance, shrinkage, damage, recount, write_off, other] }
        notes: { type: [string, "null"], maxLength: 2000 }
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [item_id, qty_change]
            properties:
              item_id: { type: integer, description: "An item with track_inventory on." }
              qty_change: { type: [string, number], description: "Signed decimal quantity; must not be 0." }
              unit_cost_cents: { type: [integer, "null"], minimum: 0, maximum: 999999999999, description: "Cost per unit for an increase. Omitted means 0 — the stock is received at zero cost and dilutes the item's average — so send it for any positive qty_change. Ignored on a decrease, which relieves stock at the current average." }
              notes: { type: [string, "null"], maxLength: 1000 }

    # ---- Tax ------------------------------------------------------------
    TaxCode:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        rate_basis_points: { type: number, description: "Rate in basis points (500 = 5%). Whole rates are integers; fractional rates such as QST's 997.5 keep their decimals." }
        agency_id: { type: [integer, "null"] }
        applies_to: { type: string, enum: [sale_only, purchase_only, both] }
        is_recoverable: { type: boolean }
        is_active: { type: boolean }
        created_at: { type: [string, "null"], format: date-time }
    TaxCodeInput:
      type: object
      required: [code, name, rate_basis_points, applies_to]
      properties:
        code: { type: string, maxLength: 20, description: "Unique within the company." }
        name: { type: string, maxLength: 255 }
        rate_basis_points: { type: number, minimum: 0, maximum: 100000, description: "Rate in basis points (500 = 5%); decimals allowed." }
        agency_id: { type: [integer, "null"] }
        applies_to: { type: string, enum: [sale_only, purchase_only, both] }
        is_recoverable: { type: boolean }
        is_active: { type: boolean }
    TaxAgency:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        registration_number: { type: [string, "null"] }
        payable_account_id: { type: integer }
        is_active: { type: boolean }
        created_at: { type: [string, "null"], format: date-time }
    TaxAgencyInput:
      type: object
      required: [name, payable_account_id]
      properties:
        name: { type: string, maxLength: 255 }
        registration_number: { type: [string, "null"], maxLength: 50 }
        payable_account_id: { type: integer, description: "The liability account tax collected for this agency accrues to." }
        is_active: { type: boolean }
    TaxReturn:
      type: object
      properties:
        id: { type: integer }
        tax_return_no: { type: [string, "null"] }
        tax_agency_id: { type: integer }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        status: { type: string, enum: [draft, filed, void] }
        collected_cents: { type: integer }
        paid_cents: { type: integer }
        net_cents: { type: integer, description: "collected less paid; positive means owing." }
        filing_reference: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        filed_at: { type: [string, "null"], format: date-time }
        voided_at: { type: [string, "null"], format: date-time }
        void_reason: { type: [string, "null"] }
        lines:
          type: array
          description: The journal lines snapshotted when the return was filed (empty on a draft).
          items:
            type: object
            properties:
              id: { type: integer }
              bucket: { type: string }
              amount_cents: { type: integer }
              entry_no: { type: [string, "null"] }
              entry_date: { type: [string, "null"], format: date }
              journal_entry_id: { type: [integer, "null"] }
              journal_line_id: { type: [integer, "null"] }
              source_type: { type: [string, "null"] }
              source_id: { type: [integer, "null"] }
              doc_label: { type: [string, "null"] }
              is_reversal: { type: boolean }
    TaxReturnInput:
      type: object
      required: [tax_agency_id, period_start, period_end]
      properties:
        tax_agency_id: { type: integer }
        tax_return_no: { type: string, maxLength: 40, description: "Create only; must be unique within the company. Omit for the next number in sequence." }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date, description: "On or after period_start." }
        filing_reference: { type: [string, "null"], maxLength: 120 }
        notes: { type: [string, "null"], maxLength: 2000 }
    TaxReturnVoidInput:
      type: object
      properties:
        void_reason: { type: string, description: 'Recorded on the return. Defaults to "Voided via API".' }
    TaxReturnPayment:
      type: object
      properties:
        id: { type: integer }
        tax_return_id: { type: integer }
        payment_no: { type: [string, "null"] }
        payment_date: { type: string, format: date }
        direction: { type: string, enum: [outgoing, incoming], description: "outgoing pays the agency; incoming records a refund from it." }
        status: { type: string, enum: [draft, posted, void] }
        bank_account_id: { type: integer }
        payment_method_id: { type: [integer, "null"] }
        reference: { type: [string, "null"] }
        net_amount_cents: { type: integer }
        penalty_cents: { type: integer }
        penalty_account_id: { type: [integer, "null"] }
        interest_cents: { type: integer }
        interest_account_id: { type: [integer, "null"] }
        commission_cents: { type: integer }
        commission_account_id: { type: [integer, "null"] }
        total_cents: { type: integer }
        notes: { type: [string, "null"] }
        posted_at: { type: [string, "null"], format: date-time }
        voided_at: { type: [string, "null"], format: date-time }
        journal_entry_id: { type: [integer, "null"] }
    TaxReturnPaymentInput:
      type: object
      description: "penalty_* and commission_* are only valid on an outgoing payment; whenever an amount is greater than 0 its matching account id is required."
      required: [payment_date, direction, bank_account_id, net_amount_cents]
      properties:
        post: { type: boolean, default: true, description: "Create only." }
        tax_return_id: { type: integer, description: "Create only (required there); the return must be filed." }
        payment_no: { type: string, maxLength: 40, description: "Create only; must be unique within the company. Omit for the next number in sequence." }
        payment_date: { type: string, format: date }
        direction: { type: string, enum: [outgoing, incoming] }
        bank_account_id: { type: integer, description: "An account with subtype bank." }
        payment_method_id: { type: [integer, "null"] }
        reference: { type: [string, "null"], maxLength: 120 }
        net_amount_cents: { type: integer, minimum: 0, maximum: 999999999999 }
        penalty_cents: { type: [integer, "null"], minimum: 0, maximum: 999999999999 }
        penalty_account_id: { type: [integer, "null"] }
        interest_cents: { type: [integer, "null"], minimum: 0, maximum: 999999999999 }
        interest_account_id: { type: [integer, "null"] }
        commission_cents: { type: [integer, "null"], minimum: 0, maximum: 999999999999 }
        commission_account_id: { type: [integer, "null"] }
        notes: { type: [string, "null"], maxLength: 2000 }

    # ---- Settings -------------------------------------------------------
    PaymentTerm:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        days: { type: integer }
        is_active: { type: boolean }
        created_at: { type: [string, "null"], format: date-time }
    PaymentTermInput:
      type: object
      required: [name, days]
      properties:
        name: { type: string, maxLength: 255 }
        days: { type: integer, minimum: 0, maximum: 365 }
        is_active: { type: boolean }
    PaymentMethod:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        is_cheque: { type: boolean }
        is_active: { type: boolean }
        created_at: { type: [string, "null"], format: date-time }
    PaymentMethodInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        is_cheque: { type: boolean, description: "Marks the method as a cheque so receipts using it feed the deposit workflow." }
        is_active: { type: boolean }

  requestBodies:
    Contact: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactInput' } } } }
    SalesOrder: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderInput' } } } }
    SalesOrderFulfillment: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderFulfillmentInput' } } } }
    Invoice: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceInput' } } } }
    Receipt: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptInput' } } } }
    CreditMemo: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreditMemoInput' } } } }
    CreditMemoRefund: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreditMemoRefundInput' } } } }
    Bill: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BillInput' } } } }
    BillPayment: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BillPaymentInput' } } } }
    Cheque: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChequeInput' } } } }
    Deposit: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DepositInput' } } } }
    Transfer: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferInput' } } } }
    BankReconciliationBegin: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BankReconciliationBeginInput' } } } }
    BankReconciliationUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BankReconciliationUpdateInput' } } } }
    Account: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountInput' } } } }
    JournalEntry: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JournalEntryInput' } } } }
    Asset: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetInput' } } } }
    AssetCategory: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetCategoryInput' } } } }
    Item: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemInput' } } } }
    StockAdjustment: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockAdjustmentInput' } } } }
    TaxCode: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaxCodeInput' } } } }
    TaxAgency: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaxAgencyInput' } } } }
    TaxReturn: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaxReturnInput' } } } }
    TaxReturnVoid: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/TaxReturnVoidInput' } } } }
    TaxReturnPayment: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaxReturnPaymentInput' } } } }
    PaymentTerm: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentTermInput' } } } }
    PaymentMethod: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentMethodInput' } } } }

  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: The API key lacks the required scope.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found in this company.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: The operation conflicts with the document's lifecycle state.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Validation failed, period locked, or entry unbalanced.
      content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
    Locked:
      description: >
        Someone is editing this record in the LineLedger web app, so the write was
        refused and nothing was changed. Wait Retry-After seconds and retry; don't
        loop. The message names the kind of record, never the person editing it.
      headers:
        Retry-After:
          description: Seconds left on the web editor's current lease (at least 1; at most the lease length, 120 by default).
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'This invoice is being edited by someone else in LineLedger. Try again shortly.' }
    InternalError:
      description: An unexpected server error. Details are not exposed; the request can be retried later.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    Contact: { description: "A contact.", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Contact' } } } } } }
    ContactCollection: { description: "A paginated list of contacts.", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Contact' } }, meta: { $ref: '#/components/schemas/PaginationMeta' }, links: { $ref: '#/components/schemas/PaginationLinks' } } } } } }
    SalesOrder: { description: "A sales order.", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/SalesOrder' } } } } } }
    SalesOrderCollection: { description: "A paginated list of sales orders.", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/SalesOrder' } }, meta: { $ref: '#/components/schemas/PaginationMeta' }, links: { $ref: '#/components/schemas/PaginationLinks' } } } } } }
    Invoice: { description: "An invoice.", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Invoice' } } } } } }
    InvoiceCollection: { description: "A paginated list of invoices.", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Invoice' } }, meta: { $ref: '#/components/schemas/PaginationMeta' }, links: { $ref: '#/components/schemas/PaginationLinks' } } } } } }
    Receipt: { description: "A customer receipt.", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Receipt' } } } } } }
    ReceiptCollection: { description: "A paginated list of receipts.", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Receipt' } }, meta: { $ref: '#/components/schemas/PaginationMeta' }, links: { $ref: '#/components/schemas/PaginationLinks' } } } } } }
    CreditMemo: { description: "A credit memo.", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CreditMemo' } } } } } }
