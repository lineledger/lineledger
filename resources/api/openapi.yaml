    post: { tags: [Banking], summary: Post a draft cheque (409 if already posted — edit it with PATCH instead), responses: { '200': {$ref: '#/components/responses/Cheque'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }

