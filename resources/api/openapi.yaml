openapi: 3.1.0
info:
  title: LineLedger REST API
  version: "1.1.0"
  description: >
    Programmatic access to a single company's accounting data over REST.

    **Authentication** — every request carries a company API key, either as
    `Authorization: Bearer <key>` or `X-Api-Key: <key>`. The key resolves the
    company server-side; there is no company id in the URL. Manage keys under
    Settings → API keys.

    **Scopes** — keys may be restricted to `{domain}:{read|write}` abilities
    (`sales`, `purchases`, `banking`, `accounting`, `inventory`, `tax`,
    `settings`). A `write` scope implies the matching `read`. A key with no
    scopes has full access. Read endpoints require `:read`; writes require `:write`.
    Every operation can answer **401** (missing or invalid key), **403** (key
    lacks the scope) and **429** (rate limited); 401 and 403 are shown on the list
    operations only and not repeated on every write.

    **Money & dates** — all monetary amounts are integer cents (e.g. `1050` =
    $10.50). Dates are `YYYY-MM-DD`; timestamps are ISO-8601. Quantities are
    decimal strings.

    **Rate limits** — 120 requests/minute per IP and 60 requests/minute per key,
    whichever is hit first. Exceeding either returns **429** with the standard
    `Retry-After` and `X-RateLimit-*` headers. The throttle runs before key
    authentication, so malformed keys are limited too.

    **Pagination, filtering & sorting** — list endpoints return `data`, `meta`
    (current_page, per_page, total, last_page) and `links`. Page size defaults
    to 25 and is capped at 100. Every list accepts `search` (LIKE over the
    columns named in its description), `sort` (one of the sortable columns
    named in its description) and `direction` (`asc` or `desc`, default `desc`,
    applied only together with `sort`). Dated documents also accept `from` /
    `to` on the date named in the description, and documents with a lifecycle
    accept `status`.

    **Document lifecycle** — `POST` creates and **posts** a document by default;
    send `"post": false` to leave it as a draft. `PATCH` (or `PUT`, an alias)
    edits a draft, or reposts a posted document in place where the document
    type supports it (invoices, credit memos, receipts, bills, bill payments,
    journal entries, deposits, cheques). Document types without an in-place
    repost (stock adjustments, transfers, tax-return payments) return **409** if
    edited after posting — void and recreate instead. `DELETE` hard-deletes a
    draft or **voids** a posted document with a reversing journal entry.
    Document numbers (`invoice_no`, `receipt_no`, `credit_memo_no`, `bill_no`,
    `payment_no`, `deposit_no`, `transfer_no`, `entry_no`, …) are optional on
    create — omit one and the next number in the company's sequence is
    assigned — and, except where a schema says otherwise, ignored on update.

    **Edit locks** — while a member has a record open for editing in the web app,
    updates, deletes and actions on that record return **423** with a
    `Retry-After` header (seconds left on their lease). Nothing is written; wait
    and retry. Reads and creates are never refused. Bank reconciliations, stock
    adjustments and tax-return payments are not covered by edit locks and never
    return 423 — a member can be working on a reconciliation in the web app at
    the same time, and the last write wins.

servers:
  - url: /api/v1

security:
  - bearerAuth: []
  - apiKeyHeader: []

tags:
  - name: Sales
    description: Customers, sales orders, invoices, receipts, credit memos.
  - name: Purchasing
    description: Vendors, employees, bills, bill payments.
  - name: Banking
    description: Cheques, deposits, transfers, bank reconciliations.
  - name: Accounting
    description: Chart of accounts, journal entries, fixed assets.
  - name: Inventory
    description: Items and stock adjustments.
  - name: Tax
    description: Tax codes, agencies, returns and return payments.
  - name: Settings
    description: Payment terms and payment methods.

paths:
  # ---- Sales -------------------------------------------------------------
  /customers:
    get: { $ref: '#/components/x-ops/contactIndex', tags: [Sales] }
    post: { $ref: '#/components/x-ops/contactStore', tags: [Sales], summary: Create a customer }
  /customers/{contact}:
    parameters: [{ $ref: '#/components/parameters/contact' }]
    get: { $ref: '#/components/x-ops/contactShow', tags: [Sales], summary: Get a customer }
    patch: { $ref: '#/components/x-ops/contactUpdate', tags: [Sales], summary: Update a customer }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Sales], summary: Delete a customer }

  /sales-orders:
    get:
      tags: [Sales]
      summary: List sales orders
      description: "Sortable: order_date, expected_date, order_no, total_cents, id. from/to filter order_date; search matches order_no and memo. status filters the stored status (open, cancelled); partial and closed are derived from invoicing and appear only in the response."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/SalesOrderCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Sales]
      summary: Create a sales order
      requestBody: { $ref: '#/components/requestBodies/SalesOrder' }
      responses:
        '201': { $ref: '#/components/responses/SalesOrder' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /sales-orders/{salesOrder}:
    parameters: [{ $ref: '#/components/parameters/salesOrder' }]
    get: { tags: [Sales], summary: Get a sales order, responses: { '200': {$ref: '#/components/responses/SalesOrder'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Sales], summary: Update an open sales order, requestBody: {$ref: '#/components/requestBodies/SalesOrder'}, responses: { '200': {$ref: '#/components/responses/SalesOrder'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Sales], summary: Delete a sales order (409 once it has invoices — cancel instead), responses: { '204': {description: Deleted.}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /sales-orders/{salesOrder}/fulfill:
    parameters: [{ $ref: '#/components/parameters/salesOrder' }]
    post: { tags: [Sales], summary: Invoice requested quantities (partial fulfillment), description: "Creates a draft invoice for the requested quantities and returns it.", requestBody: {$ref: '#/components/requestBodies/SalesOrderFulfillment'}, responses: { '201': {$ref: '#/components/responses/Invoice'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /sales-orders/{salesOrder}/cancel:
    parameters: [{ $ref: '#/components/parameters/salesOrder' }]
    post: { tags: [Sales], summary: Cancel a sales order, responses: { '200': {$ref: '#/components/responses/SalesOrder'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }

  /invoices:
    get:
      tags: [Sales]
      summary: List invoices
      description: "Sortable: invoice_date, due_date, invoice_no, total_cents, id. from/to filter invoice_date; search matches invoice_no and memo."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/InvoiceCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Sales]
      summary: Create (and post) an invoice
      requestBody: { $ref: '#/components/requestBodies/Invoice' }
      responses:
        '201': { $ref: '#/components/responses/Invoice' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /invoices/{invoice}:
    parameters: [{ $ref: '#/components/parameters/invoice' }]
    get: { tags: [Sales], summary: Get an invoice, responses: { '200': {$ref: '#/components/responses/Invoice'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Sales], summary: Update a draft / repost a posted invoice, requestBody: {$ref: '#/components/requestBodies/Invoice'}, responses: { '200': {$ref: '#/components/responses/Invoice'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Sales], summary: Void a posted invoice or delete a draft, responses: { '200': {$ref: '#/components/responses/Invoice'}, '204': {description: Draft deleted.}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /invoices/{invoice}/post:
    parameters: [{ $ref: '#/components/parameters/invoice' }]
    post: { tags: [Sales], summary: Post a draft / repost an invoice, responses: { '200': {$ref: '#/components/responses/Invoice'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }

  /receipts:
    get:
      tags: [Sales]
      summary: List customer receipts
      description: "Sortable: receipt_date, receipt_no, amount_cents, id. from/to filter receipt_date; search matches receipt_no, reference and memo."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/ReceiptCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post: { tags: [Sales], summary: Create (and post) a receipt, requestBody: {$ref: '#/components/requestBodies/Receipt'}, responses: { '201': {$ref: '#/components/responses/Receipt'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /receipts/{receipt}:
    parameters: [{ $ref: '#/components/parameters/receipt' }]
    get: { tags: [Sales], summary: Get a receipt, responses: { '200': {$ref: '#/components/responses/Receipt'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Sales], summary: Update / repost a receipt, description: "Send the full header and the complete applications list — the list replaces what is stored, so omitting an application unapplies it.", requestBody: {$ref: '#/components/requestBodies/Receipt'}, responses: { '200': {$ref: '#/components/responses/Receipt'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Sales], summary: Void a posted receipt or delete a draft, responses: { '200': {$ref: '#/components/responses/Receipt'}, '204': {description: Draft deleted.}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /receipts/{receipt}/post:
    parameters: [{ $ref: '#/components/parameters/receipt' }]
    post: { tags: [Sales], summary: Post a draft receipt, responses: { '200': {$ref: '#/components/responses/Receipt'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }

  /credit-memos:
    get:
      tags: [Sales]
      summary: List credit memos
      description: "Sortable: credit_memo_date, credit_memo_no, total_cents, id. from/to filter credit_memo_date; search matches credit_memo_no and memo."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/CreditMemoCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post: { tags: [Sales], summary: Create (and post) a credit memo, requestBody: {$ref: '#/components/requestBodies/CreditMemo'}, responses: { '201': {$ref: '#/components/responses/CreditMemo'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /credit-memos/{creditMemo}:
    parameters: [{ $ref: '#/components/parameters/creditMemo' }]
    get: { tags: [Sales], summary: Get a credit memo, responses: { '200': {$ref: '#/components/responses/CreditMemo'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Sales], summary: Update / repost a credit memo, requestBody: {$ref: '#/components/requestBodies/CreditMemo'}, responses: { '200': {$ref: '#/components/responses/CreditMemo'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Sales], summary: Void a posted credit memo or delete a draft, responses: { '200': {$ref: '#/components/responses/CreditMemo'}, '204': {description: Draft deleted.}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /credit-memos/{creditMemo}/post:
    parameters: [{ $ref: '#/components/parameters/creditMemo' }]
    post: { tags: [Sales], summary: Post a draft credit memo, responses: { '200': {$ref: '#/components/responses/CreditMemo'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /credit-memos/{creditMemo}/refund:
    parameters: [{ $ref: '#/components/parameters/creditMemo' }]
    post: { tags: [Sales], summary: Refund a posted credit memo, description: 'Records and posts a refund (money out) against a posted credit memo as a negative customer receipt (DR Accounts Receivable, CR the deposit account). The amount cannot exceed the memo''s remaining refundable balance; only a posted credit memo can be refunded. Returns the receipt.', requestBody: {$ref: '#/components/requestBodies/CreditMemoRefund'}, responses: { '201': {$ref: '#/components/responses/Receipt'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }

  # ---- Purchasing --------------------------------------------------------
  /vendors:
    get: { $ref: '#/components/x-ops/contactIndex', tags: [Purchasing], summary: List vendors }
    post: { $ref: '#/components/x-ops/contactStore', tags: [Purchasing], summary: Create a vendor }
  /vendors/{contact}:
    parameters: [{ $ref: '#/components/parameters/contact' }]
    get: { $ref: '#/components/x-ops/contactShow', tags: [Purchasing], summary: Get a vendor }
    patch: { $ref: '#/components/x-ops/contactUpdate', tags: [Purchasing], summary: Update a vendor }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Purchasing], summary: Delete a vendor }

  /employees:
    get: { $ref: '#/components/x-ops/contactIndex', tags: [Purchasing], summary: List employees }
    post: { $ref: '#/components/x-ops/contactStore', tags: [Purchasing], summary: Create an employee }
  /employees/{contact}:
    parameters: [{ $ref: '#/components/parameters/contact' }]
    get: { $ref: '#/components/x-ops/contactShow', tags: [Purchasing], summary: Get an employee }
    patch: { $ref: '#/components/x-ops/contactUpdate', tags: [Purchasing], summary: Update an employee }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Purchasing], summary: Delete an employee }

  /bills:
    get:
      tags: [Purchasing]
      summary: List bills
      description: "Sortable: bill_date, due_date, bill_no, total_cents, id. from/to filter bill_date; search matches bill_no, vendor_reference and memo."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/billType' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/BillCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post: { tags: [Purchasing], summary: Create (and post) a bill, requestBody: {$ref: '#/components/requestBodies/Bill'}, responses: { '201': {$ref: '#/components/responses/Bill'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /bills/{bill}:
    parameters: [{ $ref: '#/components/parameters/bill' }]
    get: { tags: [Purchasing], summary: Get a bill, responses: { '200': {$ref: '#/components/responses/Bill'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Purchasing], summary: Update / repost a bill, requestBody: {$ref: '#/components/requestBodies/Bill'}, responses: { '200': {$ref: '#/components/responses/Bill'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Purchasing], summary: Void a posted bill or delete a draft, responses: { '200': {$ref: '#/components/responses/Bill'}, '204': {description: Draft deleted.}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /bills/{bill}/post:
    parameters: [{ $ref: '#/components/parameters/bill' }]
    post: { tags: [Purchasing], summary: Post a draft bill, responses: { '200': {$ref: '#/components/responses/Bill'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }

  /bill-payments:
    get:
      tags: [Purchasing]
      summary: List bill payments
      description: "Sortable: payment_date, payment_no, amount_cents, id. from/to filter payment_date; search matches payment_no, reference and memo."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/BillPaymentCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post: { tags: [Purchasing], summary: Create (and post) a bill payment, requestBody: {$ref: '#/components/requestBodies/BillPayment'}, responses: { '201': {$ref: '#/components/responses/BillPayment'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /bill-payments/{billPayment}:
    parameters: [{ $ref: '#/components/parameters/billPayment' }]
    get: { tags: [Purchasing], summary: Get a bill payment, responses: { '200': {$ref: '#/components/responses/BillPayment'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Purchasing], summary: Update / repost a bill payment, description: "Send the full header and the complete applications list — the list replaces what is stored.", requestBody: {$ref: '#/components/requestBodies/BillPayment'}, responses: { '200': {$ref: '#/components/responses/BillPayment'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Purchasing], summary: Void a posted bill payment or delete a draft, responses: { '200': {$ref: '#/components/responses/BillPayment'}, '204': {description: Draft deleted.}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /bill-payments/{billPayment}/post:
    parameters: [{ $ref: '#/components/parameters/billPayment' }]
    post: { tags: [Purchasing], summary: Post a draft bill payment, responses: { '200': {$ref: '#/components/responses/BillPayment'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }

  # ---- Banking -----------------------------------------------------------
  /cheques:
    get:
      tags: [Banking]
      summary: List cheques
      description: "Sortable: cheque_date, cheque_no, amount_cents, id. from/to filter cheque_date; search matches cheque_no, payee_name and memo."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/direction' }
      responses:
        '200': { $ref: '#/components/responses/ChequeCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post: { tags: [Banking], summary: Create (and post) a cheque, requestBody: {$ref: '#/components/requestBodies/Cheque'}, responses: { '201': {$ref: '#/components/responses/Cheque'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
