        Accounts Receivable / Payable contact rule on lines is enforced on that
        repost. A voided cheque cannot be edited (409).
      requestBody: { $ref: '#/components/requestBodies/Cheque' }
      responses:
        '200': { $ref: '#/components/responses/Cheque' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '423': { $ref: '#/components/responses/Locked' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete: { tags: [Banking], summary: Void a posted cheque or delete a draft, responses: { '200': {$ref: '#/components/responses/Cheque'}, '204': {description: Draft deleted.}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '423': {$ref: '#/components/responses/Locked'}, '500': {$ref: '#/components/responses/InternalError'} } }
