openapi: 3.1.0
info:
  title: LineLedger REST API
  version: "1.0.0"
  description: >
    Programmatic access to a single company's accounting data over REST.

    **Authentication** — every request carries a company API key, either as
    `Authorization: Bearer <key>` or `X-Api-Key: <key>`. The key resolves the
    company server-side; there is no company id in the URL. Manage keys under
    Settings → API keys.

    **Scopes** — keys may be restricted to `{domain}:{read|write}` abilities
    (`sales`, `purchases`, `banking`, `accounting`, `inventory`, `tax`,
    `settings`). A `write` scope implies the matching `read`. A key with no
    scopes has full access. Read endpoints require `:read`; writes require `:write`.

    **Money & dates** — all monetary amounts are integer cents (e.g. `1050` =
    $10.50). Dates are `YYYY-MM-DD`; timestamps are ISO-8601.

    **Rate limits** — 120 requests/minute per IP and 60 requests/minute per key,
    whichever is hit first. Exceeding either returns **429** with the standard
    `Retry-After` and `X-RateLimit-*` headers. The throttle runs before key
    authentication, so malformed keys are limited too.

    **Pagination** — list endpoints return `data`, `meta` (current_page, per_page,
    total, last_page) and `links`. Page size defaults to 25 and is capped at 100.

    **Document lifecycle** — `POST` creates and **posts** a document by default;
    send `"post": false` to leave it as a draft. `PATCH` edits a draft, or
    reposts a posted document in place where the document type supports it
    (invoices, credit memos, receipts, bills, bill payments, journal entries,
    deposits). Document types without an in-place repost (cheques, stock
    adjustments, tax-return payments) return **409** if edited after posting —
    void and recreate instead. `DELETE` hard-deletes a draft or **voids** a
    posted document with a reversing journal entry.

servers:
  - url: /api/v1

security:
  - bearerAuth: []
  - apiKeyHeader: []

tags:
  - name: Sales
    description: Customers, invoices, receipts, credit memos.
  - name: Purchasing
    description: Vendors, employees, bills, bill payments.
  - name: Banking
    description: Cheques, deposits, bank reconciliations.
  - name: Accounting
    description: Chart of accounts, journal entries, fixed assets.
  - name: Inventory
    description: Items and stock adjustments.
  - name: Tax
    description: Tax codes, agencies, returns and return payments.
  - name: Settings
    description: Payment terms and payment methods.

paths:
  /customers:
    get: { $ref: '#/components/x-ops/contactIndex', tags: [Sales] }
    post: { $ref: '#/components/x-ops/contactStore', tags: [Sales] }
  /customers/{contact}:
    parameters: [{ $ref: '#/components/parameters/contact' }]
    get: { $ref: '#/components/x-ops/contactShow', tags: [Sales] }
    patch: { $ref: '#/components/x-ops/contactUpdate', tags: [Sales] }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Sales] }

  /vendors:
    get: { tags: [Purchasing], summary: List vendors, security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/page'},{$ref: '#/components/parameters/perPage'},{$ref: '#/components/parameters/search'}], responses: { '200': {$ref: '#/components/responses/ContactCollection'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Purchasing], summary: Create a vendor, requestBody: {$ref: '#/components/requestBodies/Contact'}, responses: { '201': {$ref: '#/components/responses/Contact'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /vendors/{contact}:
    parameters: [{ $ref: '#/components/parameters/contact' }]
    get: { tags: [Purchasing], summary: Get a vendor, responses: { '200': {$ref: '#/components/responses/Contact'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Purchasing], summary: Update a vendor, requestBody: {$ref: '#/components/requestBodies/Contact'}, responses: { '200': {$ref: '#/components/responses/Contact'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Purchasing] }

  /employees:
    get: { tags: [Purchasing], summary: List employees, responses: { '200': {$ref: '#/components/responses/ContactCollection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Purchasing], summary: Create an employee, requestBody: {$ref: '#/components/requestBodies/Contact'}, responses: { '201': {$ref: '#/components/responses/Contact'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /employees/{contact}:
    parameters: [{ $ref: '#/components/parameters/contact' }]
    get: { tags: [Purchasing], summary: Get an employee, responses: { '200': {$ref: '#/components/responses/Contact'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Purchasing], summary: Update an employee, requestBody: {$ref: '#/components/requestBodies/Contact'}, responses: { '200': {$ref: '#/components/responses/Contact'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Purchasing] }

  /sales-orders:
    get:
      tags: [Sales]
      summary: List sales orders
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Sales]
      summary: Create a sales order
      requestBody: { $ref: '#/components/requestBodies/SalesOrder' }
      responses:
        '201': { $ref: '#/components/responses/Document' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /sales-orders/{salesOrder}:
    parameters: [{ $ref: '#/components/parameters/salesOrder' }]
    get: { tags: [Sales], summary: Get a sales order, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Sales], summary: Update an open sales order, requestBody: {$ref: '#/components/requestBodies/SalesOrder'}, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Sales] }
  /sales-orders/{salesOrder}/fulfill:
    parameters: [{ $ref: '#/components/parameters/salesOrder' }]
    post: { tags: [Sales], summary: Invoice requested quantities (partial fulfillment), requestBody: {$ref: '#/components/requestBodies/SalesOrderFulfillment'}, responses: { '201': {$ref: '#/components/responses/Invoice'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /sales-orders/{salesOrder}/cancel:
    parameters: [{ $ref: '#/components/parameters/salesOrder' }]
    post: { tags: [Sales], summary: Cancel a sales order, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'} } }

  /invoices:
    get:
      tags: [Sales]
      summary: List invoices
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/search' }
        - { $ref: '#/components/parameters/sort' }
      responses:
        '200': { $ref: '#/components/responses/InvoiceCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Sales]
      summary: Create (and post) an invoice
      requestBody: { $ref: '#/components/requestBodies/Invoice' }
      responses:
        '201': { $ref: '#/components/responses/Invoice' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /invoices/{invoice}:
    parameters: [{ $ref: '#/components/parameters/invoice' }]
    get: { tags: [Sales], summary: Get an invoice, responses: { '200': {$ref: '#/components/responses/Invoice'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Sales], summary: Update a draft / repost a posted invoice, requestBody: {$ref: '#/components/requestBodies/Invoice'}, responses: { '200': {$ref: '#/components/responses/Invoice'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Sales], summary: Void a posted invoice or delete a draft, responses: { '200': {$ref: '#/components/responses/Invoice'}, '204': {description: Draft deleted}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /invoices/{invoice}/post:
    parameters: [{ $ref: '#/components/parameters/invoice' }]
    post: { tags: [Sales], summary: Post a draft / repost an invoice, responses: { '200': {$ref: '#/components/responses/Invoice'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }

  /receipts:
    get: { tags: [Sales], summary: List customer receipts, parameters: [{$ref: '#/components/parameters/page'},{$ref: '#/components/parameters/perPage'},{$ref: '#/components/parameters/from'},{$ref: '#/components/parameters/to'},{$ref: '#/components/parameters/status'}], responses: { '200': {$ref: '#/components/responses/Collection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Sales], summary: Create (and post) a receipt, requestBody: {$ref: '#/components/requestBodies/Receipt'}, responses: { '201': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /receipts/{receipt}:
    parameters: [{ $ref: '#/components/parameters/receipt' }]
    get: { tags: [Sales], summary: Get a receipt, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Sales], summary: Update / repost a receipt, requestBody: {$ref: '#/components/requestBodies/Receipt'}, responses: { '200': {$ref: '#/components/responses/Document'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/documentDelete', tags: [Sales] }
  /receipts/{receipt}/post:
    parameters: [{ $ref: '#/components/parameters/receipt' }]
    post: { $ref: '#/components/x-ops/documentPost', tags: [Sales] }

  /credit-memos:
    get: { tags: [Sales], summary: List credit memos, responses: { '200': {$ref: '#/components/responses/Collection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Sales], summary: Create (and post) a credit memo, requestBody: {$ref: '#/components/requestBodies/CreditMemo'}, responses: { '201': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /credit-memos/{creditMemo}:
    parameters: [{ $ref: '#/components/parameters/creditMemo' }]
    get: { tags: [Sales], summary: Get a credit memo, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Sales], summary: Update / repost a credit memo, requestBody: {$ref: '#/components/requestBodies/CreditMemo'}, responses: { '200': {$ref: '#/components/responses/Document'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/documentDelete', tags: [Sales] }
  /credit-memos/{creditMemo}/post:
    parameters: [{ $ref: '#/components/parameters/creditMemo' }]
    post: { $ref: '#/components/x-ops/documentPost', tags: [Sales] }
  /credit-memos/{creditMemo}/refund:
    parameters: [{ $ref: '#/components/parameters/creditMemo' }]
    post: { tags: [Sales], summary: Refund a posted credit memo, description: 'Records and posts a refund (money out) against a posted credit memo as a negative customer receipt (DR Accounts Receivable, CR the deposit account). The amount cannot exceed the memo''s remaining refundable balance; only a posted credit memo can be refunded.', requestBody: {$ref: '#/components/requestBodies/CreditMemoRefund'}, responses: { '201': {$ref: '#/components/responses/Document'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }

  /bills:
    get: { tags: [Purchasing], summary: List bills, responses: { '200': {$ref: '#/components/responses/Collection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Purchasing], summary: Create (and post) a bill, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '201': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /bills/{bill}:
    parameters: [{ $ref: '#/components/parameters/bill' }]
    get: { tags: [Purchasing], summary: Get a bill, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Purchasing], summary: Update / repost a bill, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '200': {$ref: '#/components/responses/Document'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/documentDelete', tags: [Purchasing] }
  /bills/{bill}/post:
    parameters: [{ $ref: '#/components/parameters/bill' }]
    post: { $ref: '#/components/x-ops/documentPost', tags: [Purchasing] }

  /bill-payments:
    get: { tags: [Purchasing], summary: List bill payments, responses: { '200': {$ref: '#/components/responses/Collection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Purchasing], summary: Create (and post) a bill payment, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '201': {$ref: '#/components/responses/Document'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /bill-payments/{billPayment}:
    parameters: [{ $ref: '#/components/parameters/billPayment' }]
    get: { tags: [Purchasing], summary: Get a bill payment, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Purchasing], summary: Update / repost a bill payment, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '200': {$ref: '#/components/responses/Document'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/documentDelete', tags: [Purchasing] }
  /bill-payments/{billPayment}/post:
    parameters: [{ $ref: '#/components/parameters/billPayment' }]
    post: { $ref: '#/components/x-ops/documentPost', tags: [Purchasing] }

  /cheques:
    get: { tags: [Banking], summary: List cheques, responses: { '200': {$ref: '#/components/responses/Collection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Banking], summary: Create (and post) a cheque, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '201': {$ref: '#/components/responses/Document'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /cheques/{cheque}:
    parameters: [{ $ref: '#/components/parameters/cheque' }]
    get: { tags: [Banking], summary: Get a cheque, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Banking], summary: "Update a draft cheque (posted: 409 — no repost)", requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '200': {$ref: '#/components/responses/Document'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/documentDelete', tags: [Banking] }
  /cheques/{cheque}/post:
    parameters: [{ $ref: '#/components/parameters/cheque' }]
    post: { $ref: '#/components/x-ops/documentPost', tags: [Banking] }

  /deposits:
    get: { tags: [Banking], summary: List deposits, responses: { '200': {$ref: '#/components/responses/Collection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Banking], summary: Create (and post) a deposit, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '201': {$ref: '#/components/responses/Document'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /deposits/{deposit}:
    parameters: [{ $ref: '#/components/parameters/deposit' }]
    get: { tags: [Banking], summary: Get a deposit, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Banking], summary: "Update a draft deposit (posted: 409 — no repost)", requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '200': {$ref: '#/components/responses/Document'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/documentDelete', tags: [Banking] }
  /deposits/{deposit}/post:
    parameters: [{ $ref: '#/components/parameters/deposit' }]
    post: { $ref: '#/components/x-ops/documentPost', tags: [Banking] }

  /bank-reconciliations:
    get: { tags: [Banking], summary: List bank reconciliations, responses: { '200': {$ref: '#/components/responses/Collection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Banking], summary: Begin a reconciliation, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '201': {$ref: '#/components/responses/Document'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /bank-reconciliations/{bankReconciliation}:
    parameters: [{ $ref: '#/components/parameters/bankReconciliation' }]
    get: { tags: [Banking], summary: Get a reconciliation, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Banking], summary: Set marked lines / adjustments, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '200': {$ref: '#/components/responses/Document'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Banking], summary: Cancel in-progress or undo the latest completed reconciliation, responses: { '204': {description: Cancelled/undone}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /bank-reconciliations/{bankReconciliation}/complete:
    parameters: [{ $ref: '#/components/parameters/bankReconciliation' }]
    post: { tags: [Banking], summary: Finalize a reconciliation, responses: { '200': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }

  /accounts:
    get: { tags: [Accounting], summary: List chart of accounts, responses: { '200': {$ref: '#/components/responses/Collection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Accounting], summary: Create an account, requestBody: {$ref: '#/components/requestBodies/Account'}, responses: { '201': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /accounts/{account}:
    parameters: [{ $ref: '#/components/parameters/account' }]
    get: { tags: [Accounting], summary: Get an account, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Accounting], summary: Update an account (system accounts can be renamed only), requestBody: {$ref: '#/components/requestBodies/Account'}, responses: { '200': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { tags: [Accounting], summary: Delete an account (409 if it has transactions), responses: { '204': {description: Deleted}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'} } }

  /journal-entries:
    get: { tags: [Accounting], summary: List journal entries, responses: { '200': {$ref: '#/components/responses/Collection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Accounting], summary: Create (and post) a journal entry, requestBody: {$ref: '#/components/requestBodies/JournalEntry'}, responses: { '201': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /journal-entries/{journalEntry}:
    parameters: [{ $ref: '#/components/parameters/journalEntry' }]
    get: { tags: [Accounting], summary: Get a journal entry, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Accounting], summary: Update a draft / amend a posted entry, requestBody: {$ref: '#/components/requestBodies/JournalEntry'}, responses: { '200': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/documentDelete', tags: [Accounting] }
  /journal-entries/{journalEntry}/post:
    parameters: [{ $ref: '#/components/parameters/journalEntry' }]
    post: { $ref: '#/components/x-ops/documentPost', tags: [Accounting] }

  /items:
    get: { tags: [Inventory], summary: List items, responses: { '200': {$ref: '#/components/responses/Collection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Inventory], summary: Create an item, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '201': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /items/{item}:
    parameters: [{ $ref: '#/components/parameters/item' }]
    get: { tags: [Inventory], summary: Get an item, responses: { '200': {$ref: '#/components/responses/Document'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'} } }
    patch: { tags: [Inventory], summary: Update an item, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '200': {$ref: '#/components/responses/Document'}, '500': {$ref: '#/components/responses/InternalError'} } }
    delete: { $ref: '#/components/x-ops/resourceDelete', tags: [Inventory] }

  /stock-adjustments:
    get: { tags: [Inventory], summary: List stock adjustments, responses: { '200': {$ref: '#/components/responses/Collection'}, '500': {$ref: '#/components/responses/InternalError'} } }
    post: { tags: [Inventory], summary: Create (and post) a stock adjustment, requestBody: {$ref: '#/components/requestBodies/Document'}, responses: { '201': {$ref: '#/components/responses/Document'}, '500': {$ref: '#/components/responses/InternalError'} } }
  /stock-adjustments/{stockAdjustment}:
