version: 2

# Weekly dependency update PRs. Beyond keeping deps current, the PR history is
# the SOC 2 (CC7.1) artifact for "we track and remediate vulnerabilities" — each
# security update arrives as a reviewable, auditable change on the record.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TCPDF 7 is a facade over tc-lib-pdf that drops the internals FPDI's
      # TCPDF adapter overrides (_putxobjects, _newobj, _out…), so the slip
      # templates and the report merger can't run on it until FPDI supports it.
      - dependency-name: tecnickcom/tcpdf
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
