name: linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege: linting only needs to read the tree.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Pint
        run: vendor/bin/pint --test

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Generate Application Key
        run: php artisan key:generate

      # Fails only on NEW issues; the 636 pre-existing findings are baselined in
      # phpstan-baseline.neon. Raise the level in phpstan.neon over time.
      - name: Run PHPStan (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
