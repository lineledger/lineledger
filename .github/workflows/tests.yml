name: tests

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next

# Least privilege: the test job only reads the tree.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          # No coverage driver: nothing here collects coverage, and a loaded
          # Xdebug slowed the suite 2-3x. CLI OPcache caches the compiled Blade
          # views every render re-includes (28% faster locally).
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.memory_consumption=256, opcache.max_accelerated_files=50000

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Run JS Unit Tests
        run: npm test

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      # Once, before the workers start: TestCase generates missing keys on first
      # use, and parallel workers on a fresh checkout would otherwise race to do it.
      - name: Generate Passport Keys
        run: php artisan passport:keys --no-interaction

      # One worker per CPU, each with its own in-memory SQLite database.
      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: ./vendor/bin/pest --parallel
