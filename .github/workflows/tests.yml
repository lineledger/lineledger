name: tests

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next

# Least privilege: the test job only reads the tree.
permissions:
  contents: read

jobs:
  # The suite split four ways, each shard on its own runner. Pest balances the
  # shards by the per-class timings in tests/.pest/shards.json; a test class
  # that file doesn't know yet is dealt round-robin and the run warns that the
  # file is out of date. Refresh it with:
  #   DB_CONNECTION=sqlite DB_DATABASE=:memory: ./vendor/bin/pest --parallel --update-shards
  shard:
    runs-on: ubuntu-latest
    strategy:
      # Let every shard finish so one run reports every failure.
      fail-fast: false
      matrix:
        php-version: ['8.5']
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          # No coverage driver: nothing here collects coverage, and a loaded
          # Xdebug slowed the suite 2-3x. CLI OPcache caches the compiled Blade
          # views every render re-includes (28% faster locally).
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.memory_consumption=256, opcache.max_accelerated_files=50000

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      # Once per run, not once per shard.
      - name: Run JS Unit Tests
        if: matrix.shard == 1
        run: npm test

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      # Once, before the workers start: TestCase generates missing keys on first
      # use, and parallel workers on a fresh checkout would otherwise race to do it.
      - name: Generate Passport Keys
        run: php artisan passport:keys --no-interaction

      # One worker per CPU, each with its own in-memory SQLite database.
      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: ./vendor/bin/pest --parallel --shard=${{ matrix.shard }}/4

  # The status the "Protect main" ruleset requires is `ci (8.5)`; this job
  # reports it, green only when every shard passed.
  ci:
    name: ci (8.5)
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.shard.result }}" = success
