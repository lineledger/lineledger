; LineLedger container overrides (loaded after php.ini-production)

memory_limit = 512M

; Livewire's temp-upload ceiling is 100 MB (config/livewire.php) —
; leave headroom above it.
upload_max_filesize = 110M
post_max_size = 120M

max_execution_time = 120
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
; Keep timestamp validation on: the entrypoint rewrites bootstrap/cache
; on every start and Blade compiles into storage at runtime.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
