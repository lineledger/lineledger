; LineLedger development overrides (loaded after php.ini-development)

memory_limit = 1G

; Livewire's temp-upload ceiling is 100 MB (config/livewire.php) —
; leave headroom above it.
upload_max_filesize = 110M
post_max_size = 120M

max_execution_time = 120

; Bind-mounted source must be re-read every request.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
